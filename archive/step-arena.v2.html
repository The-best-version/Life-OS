<!doctype html>
<html lang="ar">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html,
    body {
      height: 100%
    }

    body {
      margin: 0
    }

    img {
      max-width: 100%
    }

    [hidden] {
      display: none !important
    }
  </style>
</head>

<body>
  <title>STEP Study Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;900&display=swap">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* ═══════════════════════════════════════════════════════════
   1 · DESIGN TOKENS  —  Deep Space / Premium Glass
   ═══════════════════════════════════════════════════════════ */
    :root {
      /* Canvas */
      --bg: #070B16;
      --bg-deep: #04070F;

      /* Glass system */
      --glass: rgba(255, 255, 255, .038);
      --glass-2: rgba(255, 255, 255, .065);
      --glass-3: rgba(255, 255, 255, .095);
      --brd: rgba(255, 255, 255, .085);
      --brd-hi: rgba(255, 255, 255, .19);
      --surface: var(--glass);
      --surface-2: var(--glass-2);
      --border: var(--brd);

      /* Accents */
      --coral: #FF6B3D;
      --coral-2: #FFA63D;
      --coral-dark: #F0511F;
      --coral-bg: rgba(255, 107, 61, .13);
      --indigo: #8E7CFF;
      --indigo-bg: rgba(142, 124, 255, .14);
      --emerald: #2FE3A8;
      --emerald-bg: rgba(47, 227, 168, .12);
      --amber: #FFC24B;
      --amber-bg: rgba(255, 194, 75, .12);
      --rose: #FF5C7A;
      --rose-bg: rgba(255, 92, 122, .12);

      /* Signature gradients */
      --grad-hero: linear-gradient(118deg, #FF4E2B 0%, #FF6B3D 38%, #FF9536 68%, #FFC24B 100%);
      --grad-coral: linear-gradient(135deg, #FF6B3D, #FF9E3D);
      --grad-indigo: linear-gradient(135deg, #8E7CFF, #5D9BFF);
      --grad-emerald: linear-gradient(135deg, #2FE3A8, #35C8FF);
      --grad-amber: linear-gradient(135deg, #FFC24B, #FF9536);

      /* Text */
      --text: #EDF1FA;
      --text-2: #A2B0CA;
      --text-3: #68779A;

      /* Elevation */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .45);
      --shadow: 0 26px 60px -28px rgba(0, 0, 0, .95);
      --inset-top: inset 0 1px 0 rgba(255, 255, 255, .07);

      /* Sidebar */
      --sidebar-bg: rgba(7, 11, 22, .68);
      --sidebar-text: #8B9AB8;
      --sidebar-hover: rgba(255, 255, 255, .055);

      --r: 18px;
      --r-lg: 24px;
      --r-sm: 12px;
      --pad-x: 38px;
      --pad-y: 34px;
      --mbar: 0px;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    /* Optional light theme (dark is the shipped product) */
    :root[data-theme="light"] {
      --bg: #EEF1F8;
      --bg-deep: #E4E9F3;
      --glass: rgba(255, 255, 255, .74);
      --glass-2: rgba(255, 255, 255, .9);
      --glass-3: rgba(15, 23, 42, .05);
      --brd: rgba(15, 23, 42, .09);
      --brd-hi: rgba(15, 23, 42, .18);
      --text: #0C1220;
      --text-2: #46526B;
      --text-3: #8391AC;
      --shadow: 0 22px 50px -26px rgba(15, 23, 42, .4);
      --inset-top: inset 0 1px 0 rgba(255, 255, 255, .9);
      --sidebar-bg: rgba(10, 15, 28, .94);
    }

    /* ═══════════════════════════════════════════════════════════
   2 · BASE  —  Typography & Ambient Light
   ═══════════════════════════════════════════════════════════ */
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Tajawal', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.68;
      letter-spacing: -.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Ambient aurora — replaces the flat background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(940px 620px at 84% -10%, rgba(255, 107, 61, .22), transparent 62%),
        radial-gradient(820px 680px at 4% 104%, rgba(124, 92, 255, .20), transparent 64%),
        radial-gradient(700px 520px at 52% 40%, rgba(35, 180, 255, .055), transparent 72%),
        radial-gradient(600px 400px at 98% 78%, rgba(255, 194, 75, .07), transparent 70%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    }

    /* Fine grid weave for depth */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .5;
      background-image:
        linear-gradient(rgba(255, 255, 255, .021) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .021) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(1100px 760px at 50% 24%, #000 10%, transparent 84%);
      mask-image: radial-gradient(1100px 760px at 50% 24%, #000 10%, transparent 84%);
    }

    #root {
      height: 100%;
      position: relative;
      z-index: 1;
    }

    h1,
    h2,
    h3,
    .card-title,
    .page-title {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
    }

    .nums,
    .streak-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-variant-numeric: tabular-nums;
    }

    ::selection {
      background: rgba(255, 107, 61, .34);
      color: #fff;
    }

    .app {
      display: flex;
      height: 100%;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════════════
   3 · MOTION LIBRARY
   ═══════════════════════════════════════════════════════════ */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes heroPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 107, 61, .34), 0 30px 70px -26px rgba(255, 90, 45, .72);
      }

      50% {
        box-shadow: 0 0 0 22px rgba(255, 107, 61, 0), 0 38px 88px -24px rgba(255, 90, 45, .92);
      }
    }

    @keyframes shine {
      0% {
        transform: translateX(-130%) skewX(-18deg);
      }

      100% {
        transform: translateX(240%) skewX(-18deg);
      }
    }

    @keyframes drift {

      0%,
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(-14px, 10px, 0) scale(1.09);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      18% {
        transform: translateX(-7px);
      }

      38% {
        transform: translateX(6px);
      }

      58% {
        transform: translateX(-4px);
      }

      78% {
        transform: translateX(3px);
      }
    }

    @keyframes flicker {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .78;
        transform: scale(1.11);
      }
    }

    @keyframes trackFlow {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 22px 0;
      }
    }

    @keyframes floatY {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    .view {
      animation: fadeUp .5s var(--ease) both;
    }

    /* ═══════════════════════════════════════════════════════════
   4 · SIDEBAR  —  Frosted command rail
   ═══════════════════════════════════════════════════════════ */
    .sidebar {
      width: 266px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: none;
      background: var(--sidebar-bg);
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      border-right: 1px solid rgba(255, 255, 255, .07);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      position: relative;
    }

    .sidebar::-webkit-scrollbar {
      display: none;
    }

    .sidebar-logo {
      padding: 24px 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      position: relative;
      z-index: 1;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      background: var(--grad-coral);
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-shadow: 0 10px 26px -8px rgba(255, 107, 61, .85), var(--inset-top);
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 38%, rgba(255, 255, 255, .55) 50%, transparent 62%);
      animation: shine 4.5s var(--ease) infinite;
    }

    .logo-text {
      font-weight: 800;
      font-size: 15.5px;
      color: #fff;
      line-height: 1.25;
      letter-spacing: -.02em;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--sidebar-text);
      font-family: 'Tajawal', sans-serif;
    }

    .nav-wrap {
      padding: 14px 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: relative;
      z-index: 1;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--sidebar-text);
      padding: 10px 11px 8px;
      opacity: .55;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--sidebar-text);
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid transparent;
      background: none;
      width: 100%;
      font-family: inherit;
      text-align: left;
      transition: background .22s, color .22s, transform .22s var(--ease), border-color .22s;
      position: relative;
    }

    .nav-item:hover {
      background: var(--sidebar-hover);
      color: #fff;
      transform: translateX(3px);
    }

    .nav-item.active {
      color: #fff;
      background: linear-gradient(100deg, rgba(255, 107, 61, .22), rgba(255, 107, 61, .04));
      border-color: rgba(255, 107, 61, .3);
      box-shadow: 0 8px 22px -12px rgba(255, 107, 61, .9), var(--inset-top);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: -11px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 22px;
      border-radius: 0 4px 4px 0;
      background: var(--grad-coral);
      box-shadow: 0 0 14px 1px rgba(255, 107, 61, .9);
    }

    .nav-item.active svg {
      color: var(--coral);
      filter: drop-shadow(0 0 7px rgba(255, 107, 61, .75));
    }

    .nav-item:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: -2px;
    }

    .nav-count {
      margin-left: auto;
      background: rgba(255, 255, 255, .09);
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      font-variant-numeric: tabular-nums;
      border: 1px solid rgba(255, 255, 255, .07);
    }

    .nav-item.active .nav-count {
      background: var(--grad-coral);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px -3px rgba(255, 107, 61, .8);
    }

    .streak-box {
      margin: auto 13px 18px;
      padding: 16px;
      border-radius: 17px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(150deg, rgba(255, 107, 61, .17), rgba(255, 107, 61, .04));
      border: 1px solid rgba(255, 107, 61, .25);
      box-shadow: 0 18px 40px -24px rgba(255, 107, 61, .95), var(--inset-top);
      z-index: 1;
    }

    .streak-box::before {
      content: '';
      position: absolute;
      width: 130px;
      height: 130px;
      right: -46px;
      top: -46px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 61, .36), transparent 68%);
      animation: drift 9s ease-in-out infinite;
    }

    .streak-box>* {
      position: relative;
    }

    .streak-box svg {
      animation: flicker 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255, 107, 61, .85));
    }

    .streak-num {
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 7px;
      background: var(--grad-coral);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--coral);
    }

    .streak-num span {
      -webkit-text-fill-color: var(--coral);
      color: var(--coral);
      background: none;
      opacity: .75;
      margin: 0 !important;
      font-family: 'Tajawal', sans-serif;
      font-size: 13px;
      font-weight: 700;
    }

    /* ═══════════════════════════════════════════════════════════
   5 · MAIN / PAGE HEAD
   ═══════════════════════════════════════════════════════════ */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: var(--pad-y) var(--pad-x) 60px;
      scroll-behavior: smooth;
    }

    .main>.view {
      max-width: 1240px;
      margin: 0 auto;
    }

    .page-head {
      margin-bottom: 30px;
    }

    .page-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.24;
      margin: 0;
      background: linear-gradient(120deg, #FFFFFF 12%, #B9C6E2 92%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
    }

    .page-sub {
      color: var(--text-2);
      margin-top: 7px;
      font-size: 14px;
      font-family: 'Tajawal', sans-serif;
    }

    /* ═══════════════════════════════════════════════════════════
   6 · GLASS CARDS
   ═══════════════════════════════════════════════════════════ */
    .card {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--brd);
      border-radius: var(--r);
      padding: 24px;
      box-shadow: var(--inset-top), 0 24px 54px -34px rgba(0, 0, 0, 1);
      transition: border-color .35s, box-shadow .35s, transform .38s var(--ease), background .35s;
    }

    /* Lit glass edge */
    .card::before {
      content: '';
      position: absolute;
      left: 14%;
      right: 14%;
      top: -1px;
      height: 1px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .34), transparent);
    }

    .card-hover {
      cursor: pointer;
    }

    .card-hover:hover {
      transform: translateY(-5px) scale(1.012);
      border-color: var(--brd-hi);
      background: var(--glass-2);
      box-shadow: var(--inset-top), 0 34px 70px -30px rgba(0, 0, 0, 1), 0 0 0 1px rgba(255, 255, 255, .04);
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 800;
      line-height: 1.38;
      letter-spacing: -.018em;
    }

    .card-sub {
      font-size: 12.5px;
      color: var(--text-3);
      font-family: 'Tajawal', sans-serif;
    }

    .tile-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: var(--inset-top);
    }

    /* Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 17px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 17px;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    /* ═══════════════════════════════════════════════════════════
   7 · BADGES / NEON TRACKS
   ═══════════════════════════════════════════════════════════ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid transparent;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }

    .badge-coral {
      background: var(--coral-bg);
      color: var(--coral);
      border-color: rgba(255, 107, 61, .3);
      box-shadow: 0 0 16px -5px rgba(255, 107, 61, .9);
    }

    .badge-emerald {
      background: var(--emerald-bg);
      color: var(--emerald);
      border-color: rgba(47, 227, 168, .3);
      box-shadow: 0 0 16px -5px rgba(47, 227, 168, .9);
    }

    .badge-indigo {
      background: var(--indigo-bg);
      color: var(--indigo);
      border-color: rgba(142, 124, 255, .3);
      box-shadow: 0 0 16px -5px rgba(142, 124, 255, .9);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border-color: rgba(255, 194, 75, .3);
      box-shadow: 0 0 16px -5px rgba(255, 194, 75, .9);
    }

    .track {
      height: 9px;
      border-radius: 100px;
      overflow: hidden;
      position: relative;
      background: rgba(255, 255, 255, .07);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .55);
    }

    .fill {
      height: 100%;
      border-radius: 100px;
      position: relative;
      transition: width 1.1s var(--ease);
      box-shadow: 0 0 14px 0 currentColor;
    }

    .fill::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 100px;
      opacity: .4;
      background-image: linear-gradient(115deg, rgba(255, 255, 255, .4) 25%, transparent 25%, transparent 50%,
          rgba(255, 255, 255, .4) 50%, rgba(255, 255, 255, .4) 75%, transparent 75%);
      background-size: 22px 22px;
      animation: trackFlow 1.1s linear infinite;
    }

    /* ═══════════════════════════════════════════════════════════
   8 · PROGRESS RINGS
   ═══════════════════════════════════════════════════════════ */
    .ring {
      position: relative;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .ring svg {
      transform: rotate(-90deg);
      display: block;
      overflow: visible;
    }

    .ring-val {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .ring-arc {
      transition: stroke-dashoffset 1.25s var(--ease);
    }

    /* ═══════════════════════════════════════════════════════════
   9 · HERO — STEP Readiness Score
   ═══════════════════════════════════════════════════════════ */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--r-lg);
      padding: 34px 38px;
      background: var(--grad-hero);
      border: 1px solid rgba(255, 255, 255, .22);
      animation: heroPulse 3.6s ease-in-out infinite;
      display: flex;
      align-items: center;
      gap: 38px;
      flex-wrap: wrap;
      isolation: isolate;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(520px 320px at 88% 14%, rgba(255, 255, 255, .34), transparent 66%),
        radial-gradient(420px 280px at 12% 96%, rgba(255, 60, 120, .34), transparent 68%);
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 26%;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .3), transparent);
      animation: shine 5.5s var(--ease) infinite;
    }

    .hero>* {
      position: relative;
      z-index: 1;
    }

    .hero-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .88);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero-num {
      font-size: 82px;
      font-weight: 800;
      line-height: .95;
      color: #fff;
      letter-spacing: -.055em;
      margin-top: 8px;
      text-shadow: 0 8px 34px rgba(90, 20, 0, .42);
    }

    .hero-num span {
      font-size: 40px;
      font-weight: 700;
      opacity: .8;
      margin-left: 2px;
    }

    .hero-note {
      font-size: 14px;
      color: rgba(255, 255, 255, .94);
      margin-top: 10px;
      font-family: 'Tajawal', sans-serif;
    }

    .hero-note strong {
      font-weight: 800;
      border-bottom: 2px solid rgba(255, 255, 255, .55);
      padding-bottom: 1px;
    }

    .hero-ring {
      filter: drop-shadow(0 10px 30px rgba(120, 30, 0, .5));
    }

    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .3);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 30px;
      margin-top: 16px;
      backdrop-filter: blur(8px);
      font-family: 'Tajawal', sans-serif;
    }

    /* Streak pill in page head */
    .streak-pill {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 107, 61, .18), rgba(255, 107, 61, .05));
      border: 1px solid rgba(255, 107, 61, .3);
      box-shadow: 0 14px 34px -22px rgba(255, 107, 61, 1), var(--inset-top);
      backdrop-filter: blur(14px);
    }

    .streak-pill svg {
      color: var(--coral);
      animation: flicker 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255, 107, 61, .9));
    }

    /* Section heading */
    .sec-head {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin: 34px 0 16px;
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
    }

    .sec-head::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, .14), transparent);
    }

    .sec-bar {
      width: 4px;
      height: 21px;
      border-radius: 4px;
      background: var(--grad-coral);
      box-shadow: 0 0 14px rgba(255, 107, 61, .95);
    }

    /* ═══════════════════════════════════════════════════════════
   10 · DOMINANT CTA TILES
   ═══════════════════════════════════════════════════════════ */
    .cta {
      --c: var(--coral);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 208px;
      padding: 26px 24px;
      border-radius: var(--r-lg);
      border: 1px solid var(--brd);
      background: linear-gradient(160deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .018));
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      box-shadow: var(--inset-top), 0 24px 54px -34px rgba(0, 0, 0, 1);
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: transform .4s var(--ease), box-shadow .4s, border-color .4s, background .4s;
    }

    /* accent bloom */
    .cta::before {
      content: '';
      position: absolute;
      z-index: -1;
      width: 230px;
      height: 230px;
      right: -78px;
      top: -92px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--c), transparent 66%);
      opacity: .24;
      transition: opacity .45s, transform .55s var(--ease);
    }

    /* sweep */
    .cta::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 42%;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .16), transparent);
      transform: translateX(-160%) skewX(-18deg);
      transition: transform .85s var(--ease);
    }

    .cta>* {
      position: relative;
      z-index: 1;
    }

    .cta:hover {
      transform: translateY(-8px) scale(1.025);
      border-color: color-mix(in srgb, var(--c) 55%, transparent);
      background: linear-gradient(160deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03));
      box-shadow: var(--inset-top), 0 36px 76px -28px rgba(0, 0, 0, 1),
        0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent),
        0 22px 60px -26px var(--c);
    }

    .cta:hover::before {
      opacity: .46;
      transform: scale(1.18);
    }

    .cta:hover::after {
      transform: translateX(260%) skewX(-18deg);
    }

    .cta:focus-visible {
      outline: 2px solid var(--c);
      outline-offset: 3px;
    }

    .cta-icon {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      color: #fff;
      background: var(--c);
      background: linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 45%, #FFD08A));
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 14px 32px -12px var(--c), var(--inset-top);
      transition: transform .45s var(--ease);
    }

    .cta:hover .cta-icon {
      transform: scale(1.09) rotate(-5deg);
    }

    .cta-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.3;
    }

    .cta-sub {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 7px;
      font-family: 'Tajawal', sans-serif;
    }

    .cta-go {
      margin-top: auto;
      padding-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      color: var(--c);
      font-family: 'Tajawal', sans-serif;
      text-shadow: 0 0 22px rgba(255, 255, 255, .18);
    }

    .cta-go svg {
      transition: transform .35s var(--ease);
    }

    .cta:hover .cta-go svg {
      transform: translateX(6px);
    }

    /* Stat tiles */
    .stat {
      padding: 20px 22px;
      border-radius: var(--r);
      background: var(--glass);
      border: 1px solid var(--brd);
      backdrop-filter: blur(20px);
      box-shadow: var(--inset-top);
      position: relative;
      overflow: hidden;
      transition: transform .35s var(--ease), border-color .35s;
    }

    .stat:hover {
      transform: translateY(-3px);
      border-color: var(--brd-hi);
    }

    .stat-num {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
    }

    .stat-lbl {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 7px;
      font-family: 'Tajawal', sans-serif;
    }

    .stat-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      right: -48px;
      bottom: -58px;
      border-radius: 50%;
      opacity: .3;
    }

    /* ═══════════════════════════════════════════════════════════
   11 · BUTTONS
   ═══════════════════════════════════════════════════════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 19px;
      border-radius: 13px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform .25s var(--ease), box-shadow .3s, background .25s, border-color .25s, opacity .25s;
      white-space: nowrap;
    }

    .btn:active:not(:disabled) {
      transform: scale(.97);
    }

    .btn:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 3px;
    }

    .btn:disabled {
      opacity: .38;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--grad-coral);
      color: #fff;
      box-shadow: 0 12px 30px -12px rgba(255, 107, 61, 1), var(--inset-top);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .4), transparent);
      transform: translateX(-180%) skewX(-18deg);
      transition: transform .7s var(--ease);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 18px 42px -12px rgba(255, 107, 61, 1), var(--inset-top);
    }

    .btn-primary:hover:not(:disabled)::after {
      transform: translateX(260%) skewX(-18deg);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .045);
      color: var(--text-2);
      border-color: var(--brd);
      backdrop-filter: blur(10px);
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, .09);
      color: var(--text);
      border-color: var(--brd-hi);
      transform: translateY(-2px);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 12.5px;
      border-radius: 11px;
    }

    .btn-icon {
      padding: 9px;
    }

    /* ═══════════════════════════════════════════════════════════
   12 · FORMS
   ═══════════════════════════════════════════════════════════ */
    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 8px;
      display: block;
      letter-spacing: .01em;
      font-family: 'Tajawal', sans-serif;
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 13px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--brd);
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.6;
      transition: border-color .25s, box-shadow .25s, background .25s;
      outline: none;
    }

    .input:hover {
      border-color: rgba(255, 255, 255, .15);
    }

    .input:focus {
      border-color: rgba(255, 107, 61, .65);
      background: rgba(255, 255, 255, .06);
      box-shadow: 0 0 0 4px rgba(255, 107, 61, .14), 0 0 24px -8px rgba(255, 107, 61, .9);
    }

    .input::placeholder {
      color: var(--text-3);
    }

    textarea.input {
      min-height: 132px;
      resize: vertical;
    }

    select.input {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2368779A' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 36px;
      cursor: pointer;
    }

    select.input option {
      background: #0F1524;
      color: var(--text);
    }

    /* ═══════════════════════════════════════════════════════════
   13 · TABS & CHIPS
   ═══════════════════════════════════════════════════════════ */
    .tabs {
      display: inline-flex;
      gap: 4px;
      padding: 5px;
      border-radius: 15px;
      background: rgba(255, 255, 255, .045);
      border: 1px solid var(--brd);
      backdrop-filter: blur(14px);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, .4);
    }

    .tab {
      padding: 8px 17px;
      border-radius: 11px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-3);
      background: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: color .25s, background .25s, box-shadow .25s, transform .25s var(--ease);
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: #fff;
      background: var(--grad-coral);
      box-shadow: 0 10px 24px -10px rgba(255, 107, 61, 1), var(--inset-top);
    }

    .tab:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 2px;
    }

    .chip {
      padding: 7px 15px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      background: rgba(255, 255, 255, .04);
      color: var(--text-2);
      border: 1px solid var(--brd);
      cursor: pointer;
      transition: all .25s var(--ease);
    }

    .chip:hover {
      border-color: rgba(142, 124, 255, .55);
      color: var(--text);
      transform: translateY(-2px);
    }

    .chip.active {
      background: var(--grad-indigo);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 26px -10px rgba(142, 124, 255, 1);
    }

    /* ═══════════════════════════════════════════════════════════
   14 · FLASHCARD — realistic 3D
   ═══════════════════════════════════════════════════════════ */
    .fc-wrap {
      perspective: 1600px;
      cursor: pointer;
      padding: 10px 0;
      outline: none;
    }

    .fc-wrap:focus-visible .fc {
      box-shadow: 0 0 0 2px var(--coral);
      border-radius: var(--r-lg);
    }

    .fc {
      position: relative;
      width: 100%;
      height: 268px;
      transform-style: preserve-3d;
      transition: transform .82s cubic-bezier(.2, .85, .25, 1);
      animation: floatY 6.5s ease-in-out infinite;
    }

    .fc.flipped {
      transform: rotateY(180deg);
    }

    .fc-wrap:hover .fc:not(.flipped) {
      transform: rotateX(6deg) rotateY(-7deg);
    }

    .fc-wrap:hover .fc.flipped {
      transform: rotateY(180deg) rotateX(6deg) rotateY(7deg);
    }

    .fc-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--r-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
    }

    .fc-front {
      background: linear-gradient(158deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .028));
      border: 1px solid var(--brd-hi);
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
      box-shadow: var(--inset-top), 0 34px 70px -28px rgba(0, 0, 0, 1);
      color: var(--text);
    }

    .fc-front::before {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      left: -90px;
      bottom: -120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(142, 124, 255, .3), transparent 68%);
    }

    .fc-front::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, .14) 0%, transparent 36%);
    }

    .fc-back {
      transform: rotateY(180deg);
      color: #fff;
      background: var(--grad-hero);
      border: 1px solid rgba(255, 255, 255, .28);
      box-shadow: 0 34px 76px -26px rgba(255, 90, 45, .75);
    }

    .fc-back::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(420px 260px at 82% 8%, rgba(255, 255, 255, .3), transparent 66%);
    }

    .fc-face>* {
      position: relative;
      z-index: 1;
    }

    .fc-word {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      font-size: 34px;
      font-weight: 800;
      text-align: center;
      line-height: 1.24;
      letter-spacing: -.035em;
    }

    .fc-hint {
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--brd);
      font-family: 'Tajawal', sans-serif;
    }

    /* ═══════════════════════════════════════════════════════════
   15 · QUIZ ARENA — competitive interface
   ═══════════════════════════════════════════════════════════ */
    .opt {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 14px 17px;
      border-radius: 15px;
      background: rgba(255, 255, 255, .035);
      border: 1px solid var(--brd);
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.55;
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .28s var(--ease), border-color .28s, background .28s, box-shadow .28s;
    }

    .opt::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--coral);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform .3s var(--ease);
    }

    .opt:hover:not(:disabled) {
      transform: translateX(5px);
      border-color: rgba(255, 107, 61, .5);
      background: rgba(255, 107, 61, .09);
      box-shadow: 0 14px 34px -22px rgba(255, 107, 61, 1);
    }

    .opt:hover:not(:disabled)::before {
      transform: scaleY(1);
    }

    .opt:hover:not(:disabled) .opt-key {
      background: var(--grad-coral);
      color: #fff;
      border-color: transparent;
    }

    .opt:disabled {
      cursor: default;
    }

    .opt:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 3px;
    }

    .opt.correct {
      border-color: rgba(47, 227, 168, .65);
      background: rgba(47, 227, 168, .13);
      color: var(--emerald);
      font-weight: 800;
      box-shadow: 0 0 0 1px rgba(47, 227, 168, .3), 0 18px 46px -22px rgba(47, 227, 168, 1);
      animation: pop .55s var(--ease);
    }

    .opt.correct::before {
      background: var(--emerald);
      transform: scaleY(1);
      box-shadow: 0 0 16px var(--emerald);
    }

    .opt.correct .opt-key {
      background: var(--grad-emerald);
      color: #04140F;
      border-color: transparent;
    }

    .opt.wrong {
      border-color: rgba(255, 92, 122, .6);
      background: rgba(255, 92, 122, .12);
      color: var(--rose);
      box-shadow: 0 0 0 1px rgba(255, 92, 122, .26), 0 18px 46px -24px rgba(255, 92, 122, 1);
      animation: shake .46s ease;
    }

    .opt.wrong::before {
      background: var(--rose);
      transform: scaleY(1);
      box-shadow: 0 0 16px var(--rose);
    }

    .opt.wrong .opt-key {
      background: linear-gradient(135deg, #FF5C7A, #FF8A6B);
      color: #fff;
      border-color: transparent;
    }

    .opt-key {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--brd);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      transition: background .28s, color .28s, border-color .28s;
    }

    /* Explanation panel */
    .explain {
      margin-top: 16px;
      padding: 14px 17px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.8;
      font-family: 'Tajawal', sans-serif;
      backdrop-filter: blur(10px);
      animation: fadeUp .4s var(--ease) both;
    }

    .explain-ok {
      background: rgba(47, 227, 168, .1);
      border: 1px solid rgba(47, 227, 168, .28);
      color: var(--emerald);
    }

    .explain-bad {
      background: rgba(255, 92, 122, .1);
      border: 1px solid rgba(255, 92, 122, .28);
      color: var(--rose);
    }

    /* Quiz question shell */
    .quiz-card {
      border-radius: var(--r-lg);
      padding: 30px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .022));
      border: 1px solid var(--brd-hi);
      backdrop-filter: blur(26px) saturate(155%);
      -webkit-backdrop-filter: blur(26px) saturate(155%);
      box-shadow: var(--inset-top), 0 34px 76px -36px rgba(0, 0, 0, 1);
      position: relative;
      overflow: hidden;
    }

    .quiz-card::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      right: -120px;
      top: -150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 61, .2), transparent 68%);
      pointer-events: none;
    }

    .quiz-card>* {
      position: relative;
      z-index: 1;
    }

    .quiz-q {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 22px;
      letter-spacing: -.015em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brd-hi);
      transition: all .3s var(--ease);
    }

    .dot.at {
      width: 22px;
      border-radius: 6px;
      background: var(--grad-coral);
      box-shadow: 0 0 14px rgba(255, 107, 61, 1);
    }

    .dot.ok {
      background: var(--emerald);
      box-shadow: 0 0 10px rgba(47, 227, 168, .9);
    }

    .dot.no {
      background: var(--rose);
      box-shadow: 0 0 10px rgba(255, 92, 122, .9);
    }

    /* Result screen */
    .result {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
      padding: 44px 36px;
      border-radius: var(--r-lg);
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .022));
      border: 1px solid var(--brd-hi);
      backdrop-filter: blur(26px);
      box-shadow: var(--inset-top), 0 40px 90px -40px rgba(0, 0, 0, 1);
    }

    .result::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(460px 300px at 50% -12%, rgba(255, 107, 61, .3), transparent 66%);
    }

    .result>* {
      position: relative;
      z-index: 1;
    }

    .result-num {
      font-size: 74px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.05em;
      margin-top: 8px;
      background: var(--grad-hero);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ═══════════════════════════════════════════════════════════
   16 · NOTES HUB — Notion-style workspace
   ═══════════════════════════════════════════════════════════ */
    .editor {
      position: sticky;
      top: 0;
    }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-bottom: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--brd);
    }

    .note-row {
      padding: 18px;
      border-radius: 16px;
      cursor: pointer;
      background: var(--glass);
      border: 1px solid var(--brd);
      backdrop-filter: blur(20px);
      box-shadow: var(--inset-top);
      position: relative;
      overflow: hidden;
      transition: transform .32s var(--ease), border-color .32s, background .32s, box-shadow .32s;
    }

    .note-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--grad-indigo);
      opacity: 0;
      transition: opacity .3s;
    }

    .note-row:hover {
      transform: translateX(5px);
      border-color: var(--brd-hi);
      background: var(--glass-2);
      box-shadow: var(--inset-top), 0 22px 48px -30px rgba(0, 0, 0, 1);
    }

    .note-row:hover::before {
      opacity: 1;
    }

    .drop {
      border: 1.5px dashed var(--brd-hi);
      border-radius: 16px;
      padding: 26px;
      text-align: center;
      cursor: pointer;
      color: var(--text-3);
      background: rgba(255, 255, 255, .022);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all .3s var(--ease);
    }

    .drop:hover {
      border-color: var(--coral);
      color: var(--coral);
      background: rgba(255, 107, 61, .08);
      box-shadow: inset 0 0 40px -20px rgba(255, 107, 61, 1);
    }

    /* ═══════════════════════════════════════════════════════════
   17 · TABLE / PROSE / EMPTY
   ═══════════════════════════════════════════════════════════ */
    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .tbl th {
      padding: 13px 16px;
      text-align: left;
      white-space: nowrap;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-3);
      background: rgba(255, 255, 255, .035);
      border-bottom: 1px solid var(--brd);
    }

    .tbl td {
      padding: 13px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      vertical-align: middle;
    }

    .tbl tbody tr {
      transition: background .25s;
    }

    .tbl tbody tr:last-child td {
      border-bottom: none;
    }

    .tbl tbody tr:hover td {
      background: rgba(255, 255, 255, .045);
    }

    .prose {
      line-height: 1.95;
      color: var(--text);
    }

    .prose p {
      margin: 0 0 19px;
    }

    .prose p:last-child {
      margin-bottom: 0;
    }

    .prose strong {
      color: #fff;
      font-weight: 700;
    }

    .prose::selection,
    .prose *::selection {
      background: rgba(142, 124, 255, .38);
    }

    .empty {
      text-align: center;
      padding: 52px 26px;
      color: var(--text-2);
    }

    .empty svg {
      opacity: .55;
    }

    /* ═══════════════════════════════════════════════════════════
   18 · UTILITIES
   ═══════════════════════════════════════════════════════════ */
    .row {
      display: flex;
      align-items: center;
    }

    .col {
      display: flex;
      flex-direction: column;
    }

    .between {
      justify-content: space-between;
    }

    .wrap {
      flex-wrap: wrap;
    }

    .g6 {
      gap: 6px;
    }

    .g8 {
      gap: 8px;
    }

    .g10 {
      gap: 10px;
    }

    .g12 {
      gap: 12px;
    }

    .g16 {
      gap: 16px;
    }

    .mb8 {
      margin-bottom: 8px;
    }

    .mb12 {
      margin-bottom: 12px;
    }

    .mb16 {
      margin-bottom: 16px;
    }

    .mb20 {
      margin-bottom: 20px;
    }

    .mb24 {
      margin-bottom: 24px;
    }

    .mt8 {
      margin-top: 8px;
    }

    .mt12 {
      margin-top: 12px;
    }

    .mt16 {
      margin-top: 16px;
    }

    .mt20 {
      margin-top: 20px;
    }

    .grow {
      flex: 1;
      min-width: 0;
    }

    .nums {
      font-variant-numeric: tabular-nums;
    }

    .rtl {
      direction: rtl;
      text-align: right;
      font-family: 'Tajawal', sans-serif;
    }

    /* ═══════════════════════════════════════════════════════════
   19 · MOBILE
   ═══════════════════════════════════════════════════════════ */
    .mobile-bar {
      display: none;
    }

    .scrim {
      display: none;
    }

    @media (max-width: 1060px) {
      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero {
        padding: 28px;
        gap: 26px;
      }

      .hero-num {
        font-size: 66px;
      }
    }

    @media (max-width: 860px) {
      :root {
        --pad-x: 16px;
        --pad-y: 16px;
        --mbar: 64px;
      }

      .split {
        grid-template-columns: 1fr;
      }

      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }

      .main {
        padding: var(--pad-y) var(--pad-x) 44px;
      }

      .editor {
        position: static;
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 60;
        transform: translateX(-100%);
        transition: transform .38s var(--ease);
        box-shadow: 34px 0 70px -30px rgba(0, 0, 0, 1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: -16px -16px 18px;
        padding: 13px 16px;
        position: sticky;
        top: -16px;
        z-index: 40;
        background: rgba(7, 11, 22, .82);
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
        border-bottom: 1px solid var(--brd);
      }

      .scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 55;
        background: rgba(2, 5, 14, .7);
        backdrop-filter: blur(4px);
        animation: fadeUp .25s ease both;
      }

      .page-title {
        font-size: 23px;
      }

      .hero {
        padding: 24px 22px;
      }

      .hero-num {
        font-size: 58px;
      }

      .hero-num span {
        font-size: 28px;
      }

      .cta {
        min-height: 168px;
        padding: 22px 20px;
      }

      .fc {
        height: 236px;
      }

      .quiz-card {
        padding: 22px;
      }

      .quiz-q {
        font-size: 15.5px;
      }

      .result-num {
        font-size: 58px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 107, 61, .6);
      background-clip: content-box;
    }

    /* ═══════════════════════════════════════════════════════════
   20 · WEEKLY ACTIVITY CHART
   ═══════════════════════════════════════════════════════════ */
    .chart {
      position: relative;
      padding: 24px 24px 18px;
    }

    .chart-plot {
      position: relative;
      height: 178px;
      margin-top: 22px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .chart-grid {
      position: absolute;
      inset: 0 0 28px 0;
      pointer-events: none;
    }

    .chart-grid i {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      display: block;
      background: linear-gradient(90deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .02));
    }

    .chart-grid b {
      position: absolute;
      right: 0;
      transform: translateY(-50%);
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-3);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-variant-numeric: tabular-nums;
      background: var(--bg);
      padding: 0 4px;
      border-radius: 4px;
    }

    .bar-col {
      flex: 1;
      height: 100%;
      position: relative;
      padding-bottom: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      cursor: default;
    }

    .bar {
      width: 100%;
      max-width: 46px;
      border-radius: 9px 9px 4px 4px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--coral-2), var(--coral));
      box-shadow: 0 0 20px -4px rgba(255, 107, 61, .85), var(--inset-top);
      transition: height 1s var(--ease), filter .25s, transform .25s var(--ease);
      min-height: 3px;
    }

    .bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .35), transparent 55%);
    }

    .bar-col:hover .bar {
      filter: brightness(1.18);
      transform: translateY(-3px);
    }

    .bar.today {
      background: linear-gradient(180deg, #FFE08A, var(--coral-2));
      box-shadow: 0 0 26px -2px rgba(255, 194, 75, .95), var(--inset-top);
    }

    .bar.zero {
      background: rgba(255, 255, 255, .07);
      box-shadow: none;
    }

    .bar-hit {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bar-lbl {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      font-family: 'Tajawal', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-col.is-today .bar-lbl {
      color: var(--amber);
    }

    .bar-tip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translate(-50%, 6px);
      background: rgba(10, 15, 28, .96);
      border: 1px solid var(--brd-hi);
      border-radius: 11px;
      padding: 9px 12px;
      white-space: nowrap;
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--text);
      box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 1);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s, transform .22s var(--ease);
      z-index: 5;
      font-family: 'Tajawal', sans-serif;
    }

    .bar-col:hover .bar-tip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .chart-legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--brd);
    }

    .legend-i {
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-size: 12px;
      color: var(--text-2);
      font-family: 'Tajawal', sans-serif;
    }

    .legend-i b {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* ═══════════════════════════════════════════════════════════
   21 · LISTENING LAB — audio player
   ═══════════════════════════════════════════════════════════ */
    .player {
      position: relative;
      overflow: hidden;
      border-radius: var(--r-lg);
      padding: 26px;
      background: linear-gradient(155deg, rgba(142, 124, 255, .16), rgba(255, 255, 255, .028));
      border: 1px solid var(--brd-hi);
      backdrop-filter: blur(26px) saturate(155%);
      -webkit-backdrop-filter: blur(26px) saturate(155%);
      box-shadow: var(--inset-top), 0 30px 68px -34px rgba(0, 0, 0, 1);
    }

    .player::before {
      content: '';
      position: absolute;
      width: 340px;
      height: 340px;
      right: -130px;
      top: -170px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(142, 124, 255, .3), transparent 68%);
    }

    .player>* {
      position: relative;
      z-index: 1;
    }

    .player-head {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .player-art {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--grad-indigo);
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 16px 34px -14px rgba(142, 124, 255, 1), var(--inset-top);
      position: relative;
      overflow: hidden;
    }

    .player-art.on::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 38%, rgba(255, 255, 255, .5) 50%, transparent 62%);
      animation: shine 2.6s var(--ease) infinite;
    }

    .eq {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }

    .eq i {
      width: 3px;
      border-radius: 3px;
      background: #fff;
      height: 30%;
      display: block;
    }

    .eq.on i {
      animation: eqb .9s ease-in-out infinite;
    }

    .eq.on i:nth-child(2) {
      animation-delay: .15s;
    }

    .eq.on i:nth-child(3) {
      animation-delay: .3s;
    }

    .eq.on i:nth-child(4) {
      animation-delay: .45s;
    }

    @keyframes eqb {

      0%,
      100% {
        height: 25%;
      }

      50% {
        height: 100%;
      }
    }

    /* Timeline */
    .timeline {
      cursor: pointer;
      padding: 9px 0;
    }

    .tl-track {
      height: 7px;
      border-radius: 100px;
      position: relative;
      background: rgba(255, 255, 255, .1);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .6);
    }

    .tl-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 100px;
      background: var(--grad-indigo);
      box-shadow: 0 0 16px rgba(142, 124, 255, .95);
    }

    .tl-knob {
      position: absolute;
      top: 50%;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(142, 124, 255, .35), 0 3px 10px rgba(0, 0, 0, .6);
      transition: transform .2s var(--ease);
    }

    .timeline:hover .tl-knob {
      transform: translate(-50%, -50%) scale(1.25);
    }

    .time {
      font-size: 11.5px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
    }

    /* Transport */
    .transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .tbtn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: rgba(255, 255, 255, .055);
      border: 1px solid var(--brd);
      color: var(--text-2);
      transition: all .25s var(--ease);
    }

    .tbtn:hover:not(:disabled) {
      background: rgba(255, 255, 255, .1);
      color: var(--text);
      border-color: var(--brd-hi);
      transform: translateY(-2px);
    }

    .tbtn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .tbtn:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 3px;
    }

    .play-btn {
      width: 62px;
      height: 62px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #fff;
      background: var(--grad-indigo);
      border: 1px solid rgba(255, 255, 255, .24);
      box-shadow: 0 16px 38px -12px rgba(142, 124, 255, 1), var(--inset-top);
      transition: transform .3s var(--ease), box-shadow .3s;
    }

    .play-btn:hover:not(:disabled) {
      transform: scale(1.07);
      box-shadow: 0 22px 50px -12px rgba(142, 124, 255, 1), var(--inset-top);
    }

    .play-btn:active:not(:disabled) {
      transform: scale(.96);
    }

    .play-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .play-btn:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 4px;
    }

    /* Volume + rate */
    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 150px;
    }

    .rng {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 100px;
      cursor: pointer;
      background: rgba(255, 255, 255, .1);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .6);
      outline: none;
    }

    .rng::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(142, 124, 255, .4);
      cursor: pointer;
      transition: transform .2s;
    }

    .rng::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .rng::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(142, 124, 255, .4);
      cursor: pointer;
    }

    .rng:focus-visible {
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .6), 0 0 0 3px rgba(142, 124, 255, .35);
    }

    .rate-group {
      display: inline-flex;
      gap: 3px;
      padding: 4px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .045);
      border: 1px solid var(--brd);
    }

    .rate-b {
      padding: 5px 11px;
      border-radius: 9px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      transition: all .22s;
    }

    .rate-b:hover {
      color: var(--text);
    }

    .rate-b.on {
      background: var(--grad-indigo);
      color: #fff;
      box-shadow: 0 8px 20px -9px rgba(142, 124, 255, 1);
    }

    .transcript {
      margin-top: 18px;
      padding: 20px 22px;
      border-radius: 16px;
      background: rgba(255, 255, 255, .035);
      border: 1px solid var(--brd);
      font-size: 14px;
      line-height: 1.95;
      color: var(--text-2);
      animation: fadeUp .4s var(--ease) both;
      max-height: 340px;
      overflow-y: auto;
    }

    .transcript p {
      margin: 0 0 15px;
    }

    .transcript p:last-child {
      margin-bottom: 0;
    }

    /* ═══════════════════════════════════════════════════════════
   22 · AI TUTOR CHAT
   ═══════════════════════════════════════════════════════════ */
    .chat {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 210px);
      min-height: 460px;
      border-radius: var(--r-lg);
      overflow: hidden;
      position: relative;
      background: linear-gradient(165deg, rgba(255, 255, 255, .065), rgba(255, 255, 255, .02));
      border: 1px solid var(--brd-hi);
      backdrop-filter: blur(26px) saturate(155%);
      -webkit-backdrop-filter: blur(26px) saturate(155%);
      box-shadow: var(--inset-top), 0 30px 70px -36px rgba(0, 0, 0, 1);
    }

    .chat::before {
      content: '';
      position: absolute;
      width: 420px;
      height: 420px;
      left: -170px;
      bottom: -220px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(47, 227, 168, .16), transparent 68%);
    }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 13px;
      flex-shrink: 0;
      padding: 16px 20px;
      position: relative;
      z-index: 1;
      border-bottom: 1px solid var(--brd);
      background: rgba(255, 255, 255, .028);
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .msg {
      display: flex;
      gap: 11px;
      max-width: 80%;
      animation: fadeUp .38s var(--ease) both;
    }

    .msg.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg.ai {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .18);
      box-shadow: var(--inset-top);
    }

    /* Local sync - mirrors every step: key to report-agent's sync server so the
       charts refresh without a manual export. If the server is down the rejection
       is swallowed and localStorage stays the source of truth. */
    const SYNC_URL = 'http://127.0.0.1:47615/sync';
    let syncTimer = null;
    function syncLocal() {
      try {
        return (
          location.protocol === 'file:' ||
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1'
        );
      } catch {
        return false;
      }
    }
    function syncOut() {
      if (!syncLocal()) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        try {

            const k = localStorage.key(i);
            if (!k || k.indexOf('step:') !== 0) continue;
            try { payload[k] = JSON.parse(localStorage.getItem(k)); }
            catch { payload[k] = localStorage.getItem(k); }

            method: 'POST',
            headers: { 'Content-Type': 'text/plain', 'X-Local-Sync': '1' },
            body: JSON.stringify({ project: 'step', payload }),

      const [v, setV] = useState(0);
      useEffect(() => { const t = setTimeout(() => setV(pct), 80); return () => clearTimeout(t); }, [pct]);
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      return (
        <div className="ring" style={{ width: size, height: size }}>
          <svg width={size} height={size} viewBox={'0 0 ' + size + ' ' + size} aria-hidden="true">
            <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
            <circle className="ring-arc" cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color}
              strokeWidth={stroke} strokeLinecap="round"
              strokeDasharray={c} strokeDashoffset={c - c * v / 100}
              style={glow ? { filter: 'drop-shadow(0 0 7px ' + color + ')' } : undefined} />
          </svg>
          <div className="ring-val">{children}</div>
        </div>
      );
    }

      const handleExport = () => {
        const data = { _version: 1, _exportDate: new Date().toISOString() };
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('step:')) data[k] = localStorage.getItem(k);
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `step_arena_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data._version || !Object.keys(data).some(k => k.startsWith('step:'))) {
              alert('ملف النسخة الاحتياطية غير صحيح أو تالف.');
              return;
            }
            if (!window.confirm('هل أنت متأكد أنك تريد استعادة هذه البيانات؟ سيتم أخذ نسخة احتياطية من بياناتك الحالية قبل الاستبدال.')) {
              return;
            }
            const backup = {};
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith('step:')) backup[k] = localStorage.getItem(k);
            }
            localStorage.setItem('step_backup', JSON.stringify({ date: new Date().toISOString(), data: backup }));

            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith('step:')) keysToRemove.push(k);
            }
            keysToRemove.forEach(k => localStorage.removeItem(k));

            Object.keys(data).forEach(k => {
              if (k.startsWith('step:')) localStorage.setItem(k, data[k]);
            });

            alert('تمت الاستعادة بنجاح! سيتم تحديث الصفحة.');
            window.location.reload();
          } catch (err) {
            alert('حدث خطأ أثناء قراءة الملف: ' + err.message);
          }
        };
        reader.readAsText(file);
        e.target.value = null;

            <button type="button" className="nav-item" onClick={handleExport}>

            <label className="nav-item" style={{ cursor: 'pointer', margin: 0, width: '100%' }}>

              <span>استيراد نسخة احتياطية</span>
              <input type="file" accept=".json" style={{ display: 'none' }} onChange={handleImport} />

            <div className="row g8 mb8">
              <I.Flame size={16} style={{ color: 'var(--coral)' }} />
              <span style={{ fontSize: 10, color: 'var(--sidebar-text)', fontWeight: 700, letterSpacing: '.09em', textTransform: 'uppercase' }}>Daily Streak</span>
            </div>
            <div className="streak-num">{streak}<span style={{ fontSize: 13, fontWeight: 600, marginLeft: 5 }}>يوم</span></div>
            <div className="rtl" style={{ fontSize: 11, color: 'var(--sidebar-text)', marginTop: 9, lineHeight: 1.6 }}>{quote}</div>

    const NOTE_TAGS = ['Grammar', 'Reading', 'Writing', 'Vocabulary', 'Punctuation'];

    function NotesHub({ notes, setNotes }) {
      const [title, setTitle] = useState('');
      const [body, setBody] = useState('');
      const [tag, setTag] = useState('Grammar');
      const [img, setImg] = useState('');
      const [url, setUrl] = useState('');
      const [openNote, setOpenNote] = useState(null);
      const fileRef = useRef(null);

      const save = () => {
        if (!title.trim() || !body.trim()) return;
        const n = { id: Date.now(), title: title.trim(), body: body.trim(), tag, img: img || url.trim(), date: new Date().toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) };
        const next = [n, ...notes];
        if (!S.set('notes', next)) {
          if (n.img) {
            alert('مساحة التخزين ممتلئة! سيتم حفظ الملاحظة بدون الصورة لتجنب ضياع النص.');
            n.img = '';
            const nextNoImg = [n, ...notes];
            S.set('notes', nextNoImg);
            setNotes(nextNoImg);
          } else {
            alert('مساحة التخزين ممتلئة ولا يمكن حفظ الملاحظة.');
            return;
          }
        } else {
          setNotes(next);
        }
        logAct('notes');
        setTitle(''); setBody(''); setImg(''); setUrl('');
      };

      const remove = id => {
        const next = notes.filter(n => n.id !== id);
        setNotes(next); S.set('notes', next);
        if (openNote && openNote.id === id) setOpenNote(null);
      };

      const onFile = e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = ev => {
          const imgObj = new Image();
          imgObj.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 800; const maxH = 800;
            let w = imgObj.width; let h = imgObj.height;
            if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } }
            else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgObj, 0, 0, w, h);
            setImg(canvas.toDataURL('image/jpeg', 0.6));
            setUrl('');
          };
          imgObj.src = ev.target.result;
        };
        r.readAsDataURL(f);
      };

      const canSave = title.trim() && body.trim();

      return (
        <div>
          <div className="page-head">
            <h1 className="page-title">الملاحظات والملخصات البصرية</h1>
            <div className="page-sub">اكتب القاعدة على اليسار، وأرفق المخطط أو الصورة المساعدة — كل شيء يُحفظ تلقائياً</div>

          <div className="split">
            <div className="card editor">
              <div className="editor-head">

                <div>
                  <h2 className="card-title">ملاحظة جديدة</h2>
                  <div className="card-sub">تُحفظ تلقائياً في متصفحك</div>
                </div>
              </div>

              <label className="label" htmlFor="note-title">العنوان</label>
              <input id="note-title" className="input mb16" value={title} onChange={e => setTitle(e.target.value)} placeholder="مثال: قاعدة الاتفاق مع neither…nor" />

              <label className="label">القسم</label>
              <div className="row wrap g6 mb16">
                {NOTE_TAGS.map(t => (
                  <button key={t} className={'chip' + (tag === t ? ' active' : '')} onClick={() => setTag(t)}>{t}</button>
                ))}
              </div>

              <label className="label" htmlFor="note-body">الملخص / القاعدة</label>
              <textarea id="note-body" className="input mb16" value={body} onChange={e => setBody(e.target.value)} placeholder="اكتب القاعدة، الاستثناءات، والأمثلة…" />

              <label className="label">صورة مساعدة (مخطط، جدول، لقطة)</label>
              <div className="drop mb12" onClick={() => fileRef.current && fileRef.current.click()}>
                {img
                  ? <img src={img} alt="معاينة المرفق" style={{ maxHeight: 130, borderRadius: 9, objectFit: 'contain' }} />
                  : <><I.Upload size={22} /><div style={{ fontSize: 12.5, marginTop: 7 }}>اضغط لاختيار صورة من جهازك</div></>}
              </div>
              <input ref={fileRef} id="note-file" type="file" accept="image/*" hidden onChange={onFile} />

              <label className="label" htmlFor="note-url">أو ألصق رابط صورة</label>
              <input id="note-url" className="input mb16" value={url} onChange={e => { setUrl(e.target.value); setImg(''); }} placeholder="https://…" />

              <button className="btn btn-primary" style={{ width: '100%' }} onClick={save} disabled={!canSave}>
                <I.Save size={15} /> حفظ الملاحظة
              </button>
            </div>

            <div className="col g12">
              {openNote ? (
                <div className="card">
                  <div className="row between g12 mb12">
                    <h2 className="card-title">{openNote.title}</h2>
                    <button className="btn btn-ghost btn-icon btn-sm" onClick={() => setOpenNote(null)} aria-label="إغلاق"><I.X size={15} /></button>
                  </div>
                  <span className="badge badge-indigo mb16"><I.Tag size={11} /> {openNote.tag}</span>
                  <p style={{ fontSize: 13.5, lineHeight: 1.85, whiteSpace: 'pre-wrap', margin: '12px 0 0' }}>{openNote.body}</p>
                  {openNote.img && <img src={openNote.img} alt="مرفق الملاحظة" style={{ marginTop: 16, borderRadius: 11, width: '100%', objectFit: 'contain', border: '1px solid var(--border)' }} />}
                </div>
              ) : notes.length === 0 ? (
                <div className="card empty">
                  <I.Notes size={34} style={{ color: 'var(--text-3)' }} />
                  <div style={{ fontSize: 13.5, marginTop: 10 }}>لا توجد ملاحظات بعد</div>
                  <div className="card-sub mt8">اكتب أول ملخص لك في اللوحة المجاورة</div>
                </div>
              ) : notes.map(n => (
                <div key={n.id} className="note-row" onClick={() => setOpenNote(n)}>
                  <div className="row between g12" style={{ alignItems: 'flex-start' }}>
                    <div className="grow">
                      <div className="row g8 mb8">
                        <span className="badge badge-indigo">{n.tag}</span>
                        {n.img && <span className="badge badge-amber">صورة مرفقة</span>}
                        <span className="card-sub">{n.date}</span>
                      </div>
                      <div className="card-title" style={{ fontSize: 13.5 }}>{n.title}</div>
                      <div className="card-sub mt8" style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{n.body}</div>
                    </div>
                    <button className="btn btn-ghost btn-icon btn-sm" style={{ flexShrink: 0 }}
                      onClick={e => { e.stopPropagation(); remove(n.id); }} aria-label="حذف الملاحظة"><I.Trash size={14} /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ReadingHall() {

      const [picked, setPicked] = useState({});
      const qs = PASSAGE.questions;
      const answered = Object.keys(picked).length;
      const correct = Object.keys(picked).filter(k => qs[+k].ans === picked[k]).length;

      const choose = (qi, oi) => {
        if (picked[qi] != null) return;
        setPicked(p => ({ ...p, [qi]: oi }));
        logAct('attempts');
        if (qs[qi].ans === oi) logAct('correct');
      };

      return (
        <div>
          <div className="page-head">
            <div className="row between wrap g16">
              <div>

                  <span style={{ fontSize: 11.5, color: 'var(--text-3)' }}>التباعد</span>
                  <button className="btn btn-ghost btn-sm btn-icon" onClick={() => setLh(v => Math.max(1.5, +(v - .15).toFixed(2)))} aria-label="تقليل التباعد">−</button>
                  <button className="btn btn-ghost btn-sm btn-icon" onClick={() => setLh(v => Math.min(2.4, +(v + .15).toFixed(2)))} aria-label="زيادة التباعد">+</button>
                </div>
              </div>
            </div>
          </div>

          {answered > 0 && (
            <div className="card row g10 mb16" style={{ padding: '11px 18px', background: 'var(--emerald-bg)', borderColor: 'rgba(16,185,129,.25)' }}>
              <I.Check size={16} style={{ color: 'var(--emerald)' }} />
              <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--emerald)' }}>
                {correct} صحيحة من {answered} — تبقّى {qs.length - answered} سؤال
              </span>
            </div>
          )}

          <div className="split">
            <div className="card prose" style={{ fontSize: fs, lineHeight: lh }}>
              <h2 style={{ fontFamily: 'Plus Jakarta Sans', fontSize: fs + 5, fontWeight: 800, lineHeight: 1.3, margin: '0 0 18px' }}>{PASSAGE.title}</h2>
              {PASSAGE.body.split('\n\n').map((p, i) => <p key={i}>{p}</p>)}
            </div>

            <div className="col g16">
              {qs.map((q, qi) => {
                const chosen = picked[qi];
                const done = chosen != null;
                return (
                  <div key={qi} className="card">
                    <div className="row between mb12">
                      <span className="badge badge-indigo">Question {qi + 1}</span>
                      {done && <span className={'badge badge-' + (chosen === q.ans ? 'emerald' : 'coral')}>{chosen === q.ans ? 'صحيح' : 'خطأ'}</span>}
                    </div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, lineHeight: 1.6, marginBottom: 14 }}>{q.q}</div>
                    <div className="col g8">
                      {q.opts.map((o, oi) => (
                        <button key={oi} disabled={done} onClick={() => choose(qi, oi)}
                          className={'opt' + (done ? (oi === q.ans ? ' correct' : oi === chosen ? ' wrong' : '') : '')}>
                          <span className="opt-key">{String.fromCharCode(65 + oi)}</span>
                          <span className="grow">{o}</span>
                          {done && oi === q.ans && <I.Check size={15} />}
                          {done && oi === chosen && oi !== q.ans && <I.X size={15} />}
                        </button>
                      ))}
                    </div>
                    {done && (
                      <div className={'explain ' + (chosen === q.ans ? 'explain-ok' : 'explain-bad')}>{q.exp}</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ═══ Vocabulary Vault ═══ */
    const ST_COLOR = { new: 'amber', reviewing: 'indigo', mastered: 'emerald' };
    const ST_LABEL = { new: 'جديد', reviewing: 'مراجعة', mastered: 'متقن' };

    function VocabVault({ words, setWords }) {
      const [view, setView] = useState('cards');
      const [idx, setIdx] = useState(0);
      const [flip, setFlip] = useState(false);
      const [q, setQ] = useState('');
      const [f, setF] = useState({ word: '', ar: '', ex: '', cat: 'Vocabulary' });
