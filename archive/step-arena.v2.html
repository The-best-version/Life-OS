      const list = useMemo(() => {
        const t = q.trim().toLowerCase();
        if (!t) return words;
        return words.filter(w => (w.word || '').toLowerCase().includes(t) || (w.ar || '').includes(q.trim()) || (w.cat || '').toLowerCase().includes(t));
      }, [words, q]);

      useEffect(() => { if (idx >= list.length) { setIdx(0); setFlip(false); } }, [list.length, idx]);

      const persist = next => { setWords(next); S.set('vocab', next); };
      const add = () => {
        if (!f.word.trim() || !f.ar.trim()) return;
        persist([{ id: Date.now(), word: f.word.trim(), ar: f.ar.trim(), ex: f.ex.trim(), cat: f.cat, status: 'new' }, ...words]);
        setF({ word: '', ar: '', ex: '', cat: 'Vocabulary' });
      };
      const setStatus = (id, status) => {
        const prev = words.find(w => w.id === id);
        if (prev && prev.status !== 'mastered' && status === 'mastered') logAct('vocab');
        persist(words.map(w => w.id === id ? { ...w, status } : w));
      };
      const remove = id => persist(words.filter(w => w.id !== id));

      const cur = list[idx];
      const stats = { new: 0, reviewing: 0, mastered: 0 };
      words.forEach(w => { stats[w.status] = (stats[w.status] || 0) + 1; });

      return (
        <div>
          <div className="page-head">
            <h1 className="page-title">بنك المفردات</h1>
            <div className="page-sub">أضف الكلمة، راجعها بالبطاقات، وارفع حالتها حتى الإتقان</div>
          </div>

          <div className="grid-3 mb20">
            {['new', 'reviewing', 'mastered'].map(s => (
              <div key={s} className="stat">
                <div className="stat-glow" style={{ background: 'radial-gradient(circle, ' + CVAR[ST_COLOR[s]] + ', transparent 70%)' }} />
                <div className="stat-num nums" style={{ color: CVAR[ST_COLOR[s]] }}>{stats[s]}</div>
                <div className="stat-lbl rtl" style={{ textAlign: 'left' }}>{ST_LABEL[s]}</div>
              </div>
            ))}
          </div>

          <div className="card mb20">
            <h2 className="card-title mb16">إضافة مفردة</h2>
            <div className="grid-2 mb12">
              <div>
                <label className="label" htmlFor="v-word">الكلمة (English)</label>
                <input id="v-word" className="input" value={f.word} onChange={e => setF(s => ({ ...s, word: e.target.value }))} placeholder="Ubiquitous" />
              </div>
              <div>
                <label className="label" htmlFor="v-ar">المعنى بالعربية</label>
                <input id="v-ar" className="input rtl" value={f.ar} onChange={e => setF(s => ({ ...s, ar: e.target.value }))} placeholder="منتشر في كل مكان" />
              </div>
            </div>
            <div className="grid-2 mb16">
              <div>
                <label className="label" htmlFor="v-ex">جملة مثال</label>
                <input id="v-ex" className="input" value={f.ex} onChange={e => setF(s => ({ ...s, ex: e.target.value }))} placeholder="Smartphones are ubiquitous today." />
              </div>
              <div>
                <label className="label" htmlFor="v-cat">الفئة</label>
                <select id="v-cat" className="input" value={f.cat} onChange={e => setF(s => ({ ...s, cat: e.target.value }))}>
                  {['Vocabulary', 'Grammar', 'Reading', 'Academic'].map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <button className="btn btn-primary" onClick={add} disabled={!f.word.trim() || !f.ar.trim()}><I.Plus size={15} /> إضافة الكلمة</button>
          </div>

          <div className="row between wrap g12 mb16">
            <div className="tabs">
              <button className={'tab' + (view === 'cards' ? ' active' : '')} onClick={() => setView('cards')}>بطاقات</button>
              <button className={'tab' + (view === 'table' ? ' active' : '')} onClick={() => setView('table')}>جدول</button>
            </div>
            <div style={{ position: 'relative', flex: '1 1 200px', maxWidth: 300 }}>
              <I.Search size={14} style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-3)' }} />
              <input className="input" style={{ paddingLeft: 34 }} value={q} onChange={e => setQ(e.target.value)} placeholder="ابحث عن كلمة أو فئة…" aria-label="بحث في المفردات" />
            </div>
          </div>

          {list.length === 0 ? (
            <div className="card empty">
              <I.Brain size={34} style={{ color: 'var(--text-3)' }} />
              <div style={{ fontSize: 13.5, marginTop: 10 }}>لا توجد نتائج مطابقة</div>
            </div>
          ) : view === 'cards' ? (
            <div style={{ maxWidth: 480, margin: '0 auto' }}>
              <div className="fc-wrap" onClick={() => setFlip(v => !v)} role="button" tabIndex={0}
                onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFlip(v => !v); } }}>
                <div className={'fc' + (flip ? ' flipped' : '')}>
                  <div className="fc-face fc-front">
                    <span className={'badge badge-' + ST_COLOR[cur.status]} style={{ position: 'absolute', top: 18, right: 18 }}>{ST_LABEL[cur.status]}</span>
                    <div className="fc-word">{cur.word}</div>
                    <div style={{ fontSize: 10.5, color: 'var(--text-3)', marginTop: 11, fontWeight: 800, letterSpacing: '.18em', textTransform: 'uppercase' }}>{cur.cat}</div>
                    <div className="fc-hint"><I.Redo size={12} /> اضغط للكشف عن المعنى</div>
                  </div>
                  <div className="fc-face fc-back">
                    <div className="fc-word rtl">{cur.ar}</div>
                    {cur.ex && <div style={{ fontSize: 12.5, opacity: .94, marginTop: 18, textAlign: 'center', lineHeight: 1.8, fontStyle: 'italic', maxWidth: 330, borderTop: '1px solid rgba(255,255,255,.28)', paddingTop: 16 }}>“{cur.ex}”</div>}
                  </div>
                </div>
              </div>

              <div className="row between mt16">
                <button className="btn btn-ghost btn-sm" onClick={() => { setFlip(false); setIdx(i => (i - 1 + list.length) % list.length); }}>← السابق</button>
                <span className="nums" style={{ fontSize: 12.5, color: 'var(--text-3)' }}>{idx + 1} / {list.length}</span>
                <button className="btn btn-ghost btn-sm" onClick={() => { setFlip(false); setIdx(i => (i + 1) % list.length); }}>التالي →</button>
              </div>

              <div className="row g8 mt16" style={{ justifyContent: 'center' }}>
                {['new', 'reviewing', 'mastered'].map(s => (
                  <button key={s} className="btn btn-sm"
                    style={{
                      background: CBG[ST_COLOR[s]], color: CVAR[ST_COLOR[s]], borderColor: CVAR[ST_COLOR[s]] + '44',
                      opacity: cur.status === s ? 1 : .62, fontWeight: cur.status === s ? 700 : 600
                    }}
                    onClick={() => setStatus(cur.id, s)}>{ST_LABEL[s]}</button>
                ))}
              </div>
            </div>
          ) : (
            <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
              <div style={{ overflowX: 'auto' }}>
                <table className="tbl">
                  <thead><tr><th>الكلمة</th><th>المعنى</th><th>مثال</th><th>الفئة</th><th>الحالة</th><th></th></tr></thead>
                  <tbody>
                    {list.map(w => (
                      <tr key={w.id}>
                        <td style={{ fontFamily: 'Plus Jakarta Sans', fontWeight: 700, whiteSpace: 'nowrap' }}>{w.word}</td>
                        <td className="rtl" style={{ whiteSpace: 'nowrap' }}>{w.ar}</td>
                        <td style={{ fontSize: 12, color: 'var(--text-2)', fontStyle: 'italic', minWidth: 200 }}>{w.ex || '—'}</td>
                        <td><span className="badge badge-indigo">{w.cat}</span></td>
                        <td>
                          <select className="input" style={{ padding: '5px 28px 5px 10px', fontSize: 12, width: 'auto' }}
                            value={w.status} onChange={e => setStatus(w.id, e.target.value)} aria-label={'حالة ' + w.word}>
                            {['new', 'reviewing', 'mastered'].map(s => <option key={s} value={s}>{ST_LABEL[s]}</option>)}
                          </select>
                        </td>
                        <td><button className="btn btn-ghost btn-icon btn-sm" onClick={() => remove(w.id)} aria-label={'حذف ' + w.word}><I.Trash size={14} /></button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══ Quiz Arena ═══ */
    const CATS = ['All', 'Smart', 'Grammar', 'Vocabulary', 'Reading'];
    const CAT_COLOR = { Grammar: 'coral', Vocabulary: 'indigo', Reading: 'emerald', Smart: 'rose' };

    function QuizArena() {
      const [cat, setCat] = useState('All');
      const [i, setI] = useState(0);
      const [picked, setPicked] = useState({});
      const [done, setDone] = useState(false);

      const qs = useMemo(() => {
        const seen = S.get('seen', {});
        let pool = [];
        if (cat === 'All') pool = QUIZ;
        else if (cat === 'Smart') {
           const ms = S.get('mistakes', {});
           const wrongQs = ALL_QS.filter(q => ms[q.id]);
           if (wrongQs.length > 0) {
             const subCounts = {};
             wrongQs.forEach(q => { subCounts[q.sub] = (subCounts[q.sub] || 0) + ms[q.id].attempts; });
             const weakestSub = Object.keys(subCounts).sort((a,b) => subCounts[b] - subCounts[a])[0];
             pool = ALL_QS.filter(q => q.sub === weakestSub);
           } else {
             pool = QUIZ;
           }
        } else {
           pool = QUIZ.filter(x => x.cat === cat);
        }
        
        pool = shuffleArr(pool);
        pool.sort((a, b) => (seen[a.id] || 0) - (seen[b.id] || 0));
        
        const selected = pool.slice(0, 15);
        return selected.map(q => shuffleOpts(q));
      }, [cat]);

      useEffect(() => {
        if (qs.length > 0) {
          const seen = S.get('seen', {});
          if (seen[qs[0].id]) {
            setTimeout(() => alert('تم استهلاك جميع الأسئلة المتاحة في هذا القسم. سيتم إعادة عرض أقدم الأسئلة ظهوراً للمراجعة.'), 300);
          }
        }
      }, [qs]);
      const q = qs[i];
      const chosen = picked[i];
      const score = Object.keys(picked).filter(k => qs[+k] && qs[+k].ans === picked[k]).length;

      const reset = () => { setPicked({}); setI(0); setDone(false); };
      const pick = oi => {
        if (picked[i] != null) return;
        setPicked(p => ({ ...p, [i]: oi }));
        logAct('attempts');
        
        const seen = S.get('seen', {});
        seen[q.id] = Date.now();
        try { S.set('seen', seen); } catch {}

        if (q.ans === oi) {
           logAct('correct');
        } else {
           const ms = S.get('mistakes', {});
           if (!ms[q.id]) ms[q.id] = { added: Date.now(), attempts: 0, consecRight: 0 };
           ms[q.id].attempts++;
           ms[q.id].consecRight = 0;
           S.set('mistakes', ms);
        }
      };
      const switchCat = c => { setCat(c); setPicked({}); setI(0); setDone(false); };

      if (done) {
        const pct = Math.round((score / qs.length) * 100);
        const grade = pct >= 85 ? 'ممتاز — جاهز للاختبار' : pct >= 65 ? 'جيد — راجع أخطاءك' : 'يحتاج مراجعة مركّزة';
        return (
          <div>
            <div className="page-head"><h1 className="page-title">نتيجة الجولة</h1></div>
            <div className="result">
              <I.Award size={54} style={{ color: 'var(--coral)', filter: 'drop-shadow(0 0 16px rgba(255,107,61,.9))' }} />
              <div className="result-num nums">{pct}%</div>
              <div className="rtl" style={{ fontFamily: "'Cairo', sans-serif", fontSize: 19, fontWeight: 800, margin: '12px 0 6px' }}>{grade}</div>
              <div className="rtl nums" style={{ color: 'var(--text-2)', fontSize: 13.5 }}>{score} إجابة صحيحة من {qs.length}</div>
              <div className="track mt20" style={{ height: 11 }}><div className="fill" style={{ width: pct + '%', background: 'var(--grad-coral)', color: 'var(--coral)' }} /></div>
              <button className="btn btn-primary mt20" onClick={reset}><I.Redo size={15} /> جولة جديدة</button>
            </div>
          </div>
        );
      }

      return (
        <div>
          <div className="page-head">
            <div className="row between wrap g16">
              <div>
                <h1 className="page-title">ساحة التدريب</h1>
                <div className="page-sub">أسئلة بنمط STEP مع شرح الإجابة وفخاخ البدائل</div>
              </div>
              <div className="tabs">
                {CATS.map(c => <button key={c} className={'tab' + (cat === c ? ' active' : '')} onClick={() => switchCat(c)}>{c}</button>)}
              </div>
            </div>
          </div>

          <div className="row g16 mb20" style={{ maxWidth: 720, margin: '0 auto 22px' }}>
            <div className="track grow" style={{ height: 8 }}>
              <div className="fill" style={{ width: ((i + (chosen != null ? 1 : 0)) / qs.length * 100) + '%', background: 'var(--grad-coral)', color: 'var(--coral)' }} />
            </div>
            <span className="nums" style={{ fontSize: 12.5, color: 'var(--text-2)', flexShrink: 0 }}>{i + 1} / {qs.length}</span>
          </div>

          <div style={{ maxWidth: 720, margin: '0 auto' }}>
            <div className="quiz-card">
              <div className="row between g8 mb16">
                <span className={'badge badge-' + CAT_COLOR[q.cat]}>{q.cat}</span>
                <span className="card-sub nums">السؤال {i + 1} / {qs.length}</span>
              </div>
              <div className="quiz-q">{q.q}</div>

              <div className="col g10">
                {q.opts.map((o, oi) => (
                  <button type="button" key={oi} disabled={chosen != null} onClick={() => pick(oi)}
                    className={'opt' + (chosen != null ? (oi === q.ans ? ' correct' : oi === chosen ? ' wrong' : '') : '')}>
                    <span className="opt-key">{String.fromCharCode(65 + oi)}</span>
                    <span className="grow">{o}</span>
                    {chosen != null && oi === q.ans && <I.Check size={16} />}
                    {chosen != null && oi === chosen && oi !== q.ans && <I.X size={16} />}
                  </button>
                ))}
              </div>

              {chosen != null && (
                <>
                  <div className={'explain ' + (chosen === q.ans ? 'explain-ok' : 'explain-bad')}>
                    <strong>{chosen === q.ans ? 'إجابة صحيحة. ' : 'الإجابة الصحيحة: ' + String.fromCharCode(65 + q.ans) + '. '}</strong>{q.exp}
                  </div>
                  <div className="row mt12">
                    <button className="btn btn-ghost btn-sm" onClick={() => {
                      const rep = S.get('reported', {});
                      if (!rep[q.id]) {
                        rep[q.id] = Date.now();
                        S.set('reported', rep);
                        alert('تم الإبلاغ عن السؤال. سيتم مراجعته لاحقاً.');
                      } else {
                        alert('تم الإبلاغ عن هذا السؤال مسبقاً.');
                      }
                    }}>
                      <I.Flag size={13} /> بلّغ عن خطأ
                    </button>
                  </div>
                </>
              )}
            </div>

            <div className="row between g12 mt16">
              <button className="btn btn-ghost btn-sm" disabled={i === 0} onClick={() => setI(i - 1)}>← السابق</button>
              <div className="row g6" style={{ flexWrap: 'wrap', justifyContent: 'center' }}>
                {qs.map((_, k) => (
                  <span key={k} className={'dot' + (k === i ? ' at' : picked[k] != null ? (qs[k].ans === picked[k] ? ' ok' : ' no') : '')} />
                ))}
              </div>
              <button className="btn btn-primary btn-sm" disabled={chosen == null}
                onClick={() => {
                  if (i < qs.length - 1) {
                    setI(i + 1);
                  } else {
                    const bySec = {};
                    Object.keys(picked).forEach(k => {
                      const q = qs[+k];
                      if (q && q.cat) {
                        if (!bySec[q.cat]) bySec[q.cat] = { total: 0, correct: 0 };
                        bySec[q.cat].total++;
                        if (q.ans === picked[k]) bySec[q.cat].correct++;
                        
                        if (q.sub) {
                          if (!bySec[q.sub]) bySec[q.sub] = { total: 0, correct: 0 };
                          bySec[q.sub].total++;
                          if (q.ans === picked[k]) bySec[q.sub].correct++;
                        }
                      }
                    });
                    const hist = S.get('quiz_history', []);
                    S.set('quiz_history', [{ bySec, at: Date.now() }].concat(hist).slice(0, 50));
                    setDone(true);
                  }
                }}>
                {i < qs.length - 1 ? 'التالي →' : 'عرض النتيجة'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ═══ Weekly Activity Chart (reads the real activity log) ═══ */
    const DAY_AR = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    function WeeklyChart() {
      const [grow, setGrow] = useState(false);
      useEffect(() => { const t = setTimeout(() => setGrow(true), 120); return () => clearTimeout(t); }, []);

      const days = useMemo(() => {
        const all = S.get('activity', {});
        const out = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i);
          const a = all[DAY(d)] || {};
          const attempts = a.attempts || 0, correct = a.correct || 0, vocab = a.vocab || 0, notes = a.notes || 0;
          out.push({
            k: DAY(d), name: DAY_AR[d.getDay()], attempts, correct, vocab, notes,
            total: attempts + vocab + notes, today: i === 0
          });
        }
        return out;
      }, []);

      const max = Math.max(5, ...days.map(d => d.total));
      const totAtt = days.reduce((s, d) => s + d.attempts, 0);
      const totCor = days.reduce((s, d) => s + d.correct, 0);
      const totAll = days.reduce((s, d) => s + d.total, 0);
      const activeDays = days.filter(d => d.total > 0).length;
      const acc = totAtt ? Math.round(totCor / totAtt * 100) : 0;

      return (
        <div className="card chart mb24">
          <div className="row between wrap g12">
            <div className="row g12">
              <div className="tile-icon" style={{ background: 'var(--coral-bg)', color: 'var(--coral)' }}><I.Chart size={19} /></div>
              <div>
                <div className="card-title">نشاط آخر 7 أيام</div>
                <div className="card-sub">محسوب من استخدامك الفعلي — يُسجَّل تلقائياً مع كل إجابة</div>
              </div>
            </div>
            <span className={'badge badge-' + (activeDays >= 4 ? 'emerald' : activeDays > 0 ? 'amber' : 'indigo')}>
              {activeDays} من 7 أيام نشطة
            </span>
          </div>

          <div className="chart-plot">
            <div className="chart-grid">
              {[0, 1, 2, 3].map(g => <i key={'l' + g} style={{ bottom: (g / 3 * 100) + '%' }} />)}
              {[0, 1, 2, 3].map(g => <b key={'n' + g} style={{ bottom: (g / 3 * 100) + '%' }}>{Math.round(max * g / 3)}</b>)}
            </div>
            {days.map(d => {
              const h = (d.total / max) * 100;
              return (
                <div key={d.k} className={'bar-col' + (d.today ? ' is-today' : '')}>
                  <div className="bar-tip">
                    <strong>{d.today ? 'اليوم' : d.name}</strong>
                    <div>{d.total === 0 ? 'لا يوجد نشاط' : d.attempts + ' إجابة · ' + d.correct + ' صحيحة'}</div>
                    {(d.vocab > 0 || d.notes > 0) && <div>{d.vocab} مفردة · {d.notes} ملاحظة</div>}
                  </div>
                  <div className={'bar' + (d.today ? ' today' : '') + (d.total ? '' : ' zero')}
                    style={{ height: grow ? (d.total ? Math.max(h, 4) : 1.6) + '%' : '0%' }} />
                  <div className="bar-lbl">{d.today ? 'اليوم' : d.name}</div>
                </div>
              );
            })}
          </div>

          <div className="chart-legend">
            <div className="legend-i"><b style={{ color: 'var(--coral)' }}>{totAll}</b> نشاط إجمالي</div>
            <div className="legend-i"><b style={{ color: 'var(--emerald)' }}>{acc}%</b> دقة الإجابات</div>
            <div className="legend-i"><b style={{ color: 'var(--indigo)' }}>{totAtt}</b> سؤال مُجاب</div>
            {totAll === 0 && <div className="legend-i" style={{ color: 'var(--text-3)' }}>ابدأ أي جلسة وسترى العمود يرتفع هنا</div>}
          </div>
        </div>
      );
    }

    /* ═══ Listening Lab ═══ */
    const RATES = [0.75, 1, 1.25, 1.5];

    function ListeningLab() {
      const aRef = useRef(null);
      const fileRef = useRef(null);
      const [name, setName] = useState('');
      const [playing, setPlaying] = useState(false);
      const [cur, setCur] = useState(0);
      const [dur, setDur] = useState(0);
      const [vol, setVol] = useState(0.9);
      const [rate, setRate] = useState(1);
      const [tts, setTts] = useState(false);
      const [showT, setShowT] = useState(false);
      const [picked, setPicked] = useState({});

      const qs = LISTENING.questions;
      const answered = Object.keys(picked).length;
      const correct = Object.keys(picked).filter(k => qs[+k].ans === picked[k]).length;
      const hasAudio = !!name;
      const canTTS = typeof window !== 'undefined' && 'speechSynthesis' in window;

      useEffect(() => () => { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch { } }, []);
      useEffect(() => { const a = aRef.current; if (a) { a.volume = vol; a.playbackRate = rate; } }, [vol, rate]);

      const onFile = e => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const a = aRef.current;
        if (a) { a.src = URL.createObjectURL(f); a.load(); a.volume = vol; a.playbackRate = rate; }
        setName(f.name); setCur(0); setDur(0); setPlaying(false);
      };

      const toggle = () => {
        const a = aRef.current;
        if (!a || !hasAudio) return;
        if (a.paused) { const p = a.play(); if (p && p.then) p.then(() => setPlaying(true)).catch(() => setPlaying(false)); else setPlaying(true); }
        else { a.pause(); setPlaying(false); }
      };

      const seek = e => {
        const a = aRef.current;
        if (!a || !dur) return;
        const r = e.currentTarget.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        a.currentTime = ratio * dur; setCur(a.currentTime);
      };

      const skip = s => {
        const a = aRef.current;
        if (!a || !dur) return;
        a.currentTime = Math.min(dur, Math.max(0, a.currentTime + s));
        setCur(a.currentTime);
      };

      const speak = () => {
        if (!canTTS) return;
        const synth = window.speechSynthesis;
        if (tts) { synth.cancel(); setTts(false); return; }
        synth.cancel();
        const u = new SpeechSynthesisUtterance(LISTENING.transcript);
        u.lang = 'en-US'; u.rate = rate; u.volume = vol;
        u.onend = () => setTts(false);
        u.onerror = () => setTts(false);
        synth.speak(u); setTts(true);
      };

      const choose = (qi, oi) => {
        if (picked[qi] != null) return;
        setPicked(p => ({ ...p, [qi]: oi }));
        logAct('attempts');
        if (qs[qi].ans === oi) logAct('correct');
      };

      const fmt = s => {
        const v = Math.max(0, Math.floor(s || 0));
        return Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0');
      };
      const pct = dur ? (cur / dur) * 100 : 0;
      const live = playing || tts;

      return (
        <div>
          <div className="page-head">
            <h1 className="page-title">قسم الاستماع</h1>
            <div className="page-sub">استمع للمقطع الأكاديمي، ثم أجب دون النظر إلى النص — كما في الاختبار الحقيقي</div>
          </div>

          <div className="player mb24">
            <audio ref={aRef} preload="metadata" hidden
              onLoadedMetadata={e => setDur(e.target.duration || 0)}
              onTimeUpdate={e => setCur(e.target.currentTime || 0)}
              onEnded={() => { setPlaying(false); setCur(0); }}
              onPause={() => setPlaying(false)}
              onPlay={() => setPlaying(true)} />

            <div className="player-head">
              <div className={'player-art' + (live ? ' on' : '')}>
                {live
                  ? <div className="eq on"><i /><i /><i /><i /></div>
                  : <I.Headphones size={28} />}
              </div>
              <div className="grow">
                <div className="card-title" style={{ fontSize: 16.5 }}>{LISTENING.title}</div>
                <div className="card-sub mt8">{LISTENING.meta}</div>
                <div className="row g8 mt8 wrap">
                  {name
                    ? <span className="badge badge-indigo"><I.Music size={11} /> {name}</span>
                    : <span className="badge badge-amber">لم يُحمَّل ملف صوتي بعد</span>}
                  {tts && <span className="badge badge-emerald">قراءة آلية جارية</span>}
                </div>
              </div>
            </div>

            <div className="timeline" onClick={seek} role="slider" aria-label="شريط التقدم"
              aria-valuemin={0} aria-valuemax={Math.round(dur)} aria-valuenow={Math.round(cur)}>
              <div className="tl-track">
                <div className="tl-fill" style={{ width: pct + '%' }} />
                <div className="tl-knob" style={{ left: pct + '%' }} />
              </div>
            </div>
            <div className="row between mb16">
              <span className="time">{fmt(cur)}</span>
              <span className="time">{dur ? fmt(dur) : '--:--'}</span>
            </div>

            <div className="transport">
              <button type="button" className="tbtn" onClick={() => skip(-10)} disabled={!hasAudio} aria-label="رجوع 10 ثوانٍ"><I.Rew size={17} /></button>
              <button type="button" className="play-btn" onClick={toggle} disabled={!hasAudio}
                aria-label={playing ? 'إيقاف مؤقت' : 'تشغيل'}>
                {playing ? <I.Pause size={24} /> : <I.Play size={24} />}
              </button>
              <button type="button" className="tbtn" onClick={() => skip(10)} disabled={!hasAudio} aria-label="تقديم 10 ثوانٍ"><I.Fwd size={17} /></button>

              <div className="vol-wrap">
                <button type="button" className="tbtn" style={{ width: 38, height: 38 }}
                  onClick={() => setVol(v => v > 0 ? 0 : 0.9)} aria-label="كتم الصوت">
                  {vol > 0 ? <I.Vol size={16} /> : <I.VolX size={16} />}
                </button>
                <input className="rng" type="range" min="0" max="1" step="0.01" value={vol}
                  onChange={e => setVol(+e.target.value)} aria-label="مستوى الصوت" />
              </div>

              <div className="rate-group">
                {RATES.map(r => (
                  <button type="button" key={r} className={'rate-b' + (rate === r ? ' on' : '')} onClick={() => setRate(r)}>{r}×</button>
                ))}
              </div>
            </div>

            <div className="row g8 wrap mt20" style={{ justifyContent: 'center' }}>
              <input ref={fileRef} type="file" accept="audio/*" hidden onChange={onFile} />
              <button type="button" className="btn btn-ghost btn-sm" onClick={() => fileRef.current && fileRef.current.click()}>
                <I.Upload size={14} /> {name ? 'استبدال الملف الصوتي' : 'حمّل ملف صوتي'}
              </button>
              {canTTS && (
                <button type="button" className={'btn btn-sm ' + (tts ? 'btn-primary' : 'btn-ghost')} onClick={speak}>
                  {tts ? <I.Pause size={14} /> : <I.Play size={14} />} {tts ? 'إيقاف القراءة الآلية' : 'قراءة آلية للنص'}
                </button>
              )}
              <button type="button" className="btn btn-ghost btn-sm" onClick={() => setShowT(v => !v)}>
                <I.Text size={14} /> {showT ? 'إخفاء النص' : 'إظهار النص'}
              </button>
            </div>

            {showT && (
              <div className="transcript">
                {LISTENING.transcript.split('\n\n').map((p, i) => <p key={i}>{p}</p>)}
              </div>
            )}
          </div>

          {answered > 0 && (
            <div className="card row g10 mb16" style={{ padding: '12px 20px', background: 'var(--emerald-bg)', borderColor: 'rgba(47,227,168,.28)' }}>
              <I.Check size={16} style={{ color: 'var(--emerald)' }} />
              <span className="rtl" style={{ fontSize: 13.5, fontWeight: 700, color: 'var(--emerald)', textAlign: 'left' }}>
                {correct} صحيحة من {answered} — تبقّى {qs.length - answered} سؤال
              </span>
            </div>
          )}

          <h2 className="sec-head"><span className="sec-bar" /> أسئلة الاستيعاب السمعي</h2>
          <div className="grid-2">
            {qs.map((q, qi) => {
              const chosen = picked[qi];
              const done = chosen != null;
              return (
                <div key={qi} className="card">
                  <div className="row between mb12">
                    <span className="badge badge-indigo">Question {qi + 1}</span>
                    {done && <span className={'badge badge-' + (chosen === q.ans ? 'emerald' : 'coral')}>{chosen === q.ans ? 'صحيح' : 'خطأ'}</span>}
                  </div>
                  <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.6, marginBottom: 15 }}>{q.q}</div>
                  <div className="col g8">
                    {q.opts.map((o, oi) => (
                      <button type="button" key={oi} disabled={done} onClick={() => choose(qi, oi)}
                        className={'opt' + (done ? (oi === q.ans ? ' correct' : oi === chosen ? ' wrong' : '') : '')}>
                        <span className="opt-key">{String.fromCharCode(65 + oi)}</span>
                        <span className="grow">{o}</span>
                        {done && oi === q.ans && <I.Check size={15} />}
                        {done && oi === chosen && oi !== q.ans && <I.X size={15} />}
                      </button>
                    ))}
                  </div>
                  {done && <div className={'explain ' + (chosen === q.ans ? 'explain-ok' : 'explain-bad')}>{q.exp}</div>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       AI Tutor — backend seam
       ───────────────────────────────────────────────────────────────
       ضع رابط الـ endpoint في TUTOR_API لتفعيل الاتصال الحقيقي.
       المتوقع: POST يستقبل { messages: [{role, content}] }
                ويرجّع { reply: "..." }
       ما دام TUTOR_API = null فالمدرب يعمل بوضع تجريبي بدون إنترنت.
       ═══════════════════════════════════════════════════════════════ */
    const TUTOR_API = null;

    const SOC_RULES = [
      {
        k: ['grammar', 'قواعد', 'نحو', 'إعراب', 'tense', 'زمن', 'فعل'],
        a: 'قبل ما أعطيك القاعدة — خذ هذي: "Neither the manager nor the employees ___ informed."\n\nالفعل يتفق مع أي طرف: الأقرب له أم الأبعد؟ جاوب بكلمة وحدة وبعدها نبني القاعدة سوا.'
      },
      {
        k: ['vocab', 'مفرد', 'كلمة', 'معنى', 'ترجم', 'word'],
        a: 'ممتاز. بدل ما تحفظ المعنى مجرّد — جرّب هذي الطريقة:\n\n1. استخدم الكلمة في جملة عن يومك أنت.\n2. اكتب لها ضدّ.\n3. اكتب كلمة تُشبهها لكنها ليست مرادفة.\n\nأي كلمة تبي نبدأ فيها؟ اكتبها وسوّي الخطوات الثلاث، وأنا أصحّح لك.'
      },
      {
        k: ['reading', 'قراءة', 'استيعاب', 'passage', 'نص'],
        a: 'سؤال قبل الشرح: لما تقرأ فقرة أكاديمية، وش أول شي تدوّر عليه — الفكرة الرئيسية، أم كلمات الربط مثل however و despite؟\n\nجاوب، وبعدها أوريك ليش ترتيبك هذا يغيّر درجتك في القسم كله.'
      },
      {
        k: ['listening', 'استماع', 'سماع', 'audio', 'صوت'],
        a: 'في الاستماع، أكثر خطأ إن الطالب يحاول يفهم كل كلمة.\n\nسؤال: في إعلان أكاديمي، أي معلومة عادةً تكون هي المطلوبة — التفاصيل الرقمية، أم التغييرات عن المعتاد ("no longer", "instead of", "rather than")؟\n\nفكّر وجاوب.'
      },
      {
        k: ['writing', 'كتابة', 'مقال', 'essay', 'تحليل'],
        a: 'قبل ما تكتب أي مقال، جاوبني على هذا:\n\nما هي الجملة الواحدة اللي لو حذفتها انهار مقالك كله؟\n\nهذي هي الـ thesis. اكتبها لي في سطر واحد وأنا أقيّمها معك.'
      },
      {
        k: ['وقت', 'time', 'سرعة', 'أتأخر', 'ما ألحق'],
        a: 'مشكلة الوقت غالباً ليست سرعة قراءة — بل تردد في الحذف.\n\nسؤال: كم سؤال تركته فاضي آخر مرة تدرّبت؟ وكم سؤال رجعت له وغيّرت إجابتك — وكم مرة كان التغيير في صالحك؟\n\nالأرقام هذي بتكشف المشكلة الحقيقية.'
      },
      {
        k: ['توتر', 'قلق', 'خايف', 'أخاف', 'stress', 'anxiety'],
        a: 'مفهوم، والقلق قبل الاختبار طبيعي.\n\nسؤال واحد: في آخر جلسة تدريب، هل كان أداؤك أضعف فعلاً — أم إحساسك بالأداء هو الأضعف؟\n\nافتح لوحة التقدم وشوف رقم الدقة الحقيقي، ورجع لي فيه.'
      },
      {
        k: ['درجة', 'score', 'كم أحتاج', 'نسبة', 'هدف'],
        a: 'قبل ما نتكلم عن الدرجة — وش الدرجة المطلوبة عندك بالضبط، ووش آخر درجة حصلتها؟\n\nالفرق بين الرقمين هو خطة المذاكرة كلها. اكتب لي الرقمين.'
      },
    ];

    const SOC_FALLBACK = [
      'سؤال مرتد قبل ما أجاوب: وش اللي جرّبته لحد الآن في هذي النقطة، ووين بالضبط توقفت؟',
      'قبل الإجابة الجاهزة — لو تشرح هذي النقطة لطالب مبتدئ، وش أول جملة بتقولها له؟ اكتبها وبنبني عليها.',
      'خلنا نعكسها: وش الإجابة اللي تتوقعها أنت، وليش؟ لو كانت صح بنثبّتها، ولو غلط بنعرف مصدر الخطأ بالضبط.',
      'نقطة جيدة. عشان أوجّهك صح: هل المشكلة في فهم القاعدة، أم في تطبيقها تحت ضغط الوقت؟',
    ];

    function localSocratic(text, n) {
      const t = (text || '').toLowerCase();
      for (let i = 0; i < SOC_RULES.length; i++) {
        const r = SOC_RULES[i];
        for (let j = 0; j < r.k.length; j++) {
          if (t.indexOf(r.k[j].toLowerCase()) !== -1) return r.a;
        }
      }
      return SOC_FALLBACK[n % SOC_FALLBACK.length];
    }

    async function askTutor(messages) {
      if (TUTOR_API) {
        const res = await fetch(TUTOR_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: messages.map(m => ({ role: m.role === 'me' ? 'user' : 'assistant', content: m.text }))
          })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const j = await res.json();
        return j.reply || j.content || '';
      }
      await new Promise(r => setTimeout(r, 620 + Math.random() * 480));
      const last = messages[messages.length - 1];
      return localSocratic(last ? last.text : '', messages.length);
    }

    const TUTOR_SEED = [{
      role: 'ai',
      text: 'أهلاً بك. أنا مدربك السقراطي لاختبار STEP.\n\nقاعدتي واحدة: لا أعطيك الإجابة مباشرة — أسألك حتى تصل لها بنفسك، لأن اللي توصل له بنفسك ما تنساه في القاعة.\n\nابدأ بأي شي: قاعدة تحيّرك، كلمة ما ثبتت معك، أو درجة تبي توصل لها.',
      at: 0
    }];

    const TUTOR_CHIPS = ['عندي مشكلة في القواعد', 'كيف أثبّت المفردات؟', 'ما ألحق الوقت في القراءة', 'أتوتر قبل الاختبار'];

    function AiTutor() {
      const [msgs, setMsgs] = useState(() => S.get('tutor', TUTOR_SEED));
      const [draft, setDraft] = useState('');
      const [thinking, setThinking] = useState(false);
      const logRef = useRef(null);
      const taRef = useRef(null);

      const persist = next => { setMsgs(next); S.set('tutor', next); };

      useEffect(() => {
        const el = logRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [msgs, thinking]);

      const send = async txt => {
        const t = (txt != null ? txt : draft).trim();
        if (!t || thinking) return;
        const next = msgs.concat([{ role: 'me', text: t, at: Date.now() }]);
        persist(next);
        setDraft('');
        setThinking(true);
        try {
          const reply = await askTutor(next);
          persist(next.concat([{ role: 'ai', text: reply, at: Date.now() }]));
        } catch (err) {
          persist(next.concat([{ role: 'ai', text: 'تعذّر الاتصال بالمدرب: ' + (err && err.message ? err.message : 'خطأ غير معروف') + '\n\nتأكد من إعداد TUTOR_API في الكود.', at: Date.now() }]));
        }
        setThinking(false);
      };

      const onKey = e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      };

      const clear = () => persist(TUTOR_SEED);
      const hhmm = ts => ts ? new Date(ts).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }) : '';

      return (
        <div>
          <div className="page-head">
            <div className="row between wrap g16">
              <div>
                <h1 className="page-title">المدرب السقراطي الذكي</h1>
                <div className="page-sub">لا يعطيك الإجابة — يسألك حتى تصل لها بنفسك</div>
              </div>
              <button type="button" className="btn btn-ghost btn-sm" onClick={clear}><I.Trash size={14} /> محادثة جديدة</button>
            </div>
          </div>

          <div className="chat">
            <div className="chat-head">
              <div className="avatar ai" style={{ width: 40, height: 40, borderRadius: 14 }}><I.Spark size={20} /></div>
              <div className="grow">
                <div className="card-title" style={{ fontSize: 14.5 }}>STEP Socratic Coach</div>
                <div className="card-sub">{thinking ? 'يكتب الآن…' : 'جاهز لسؤالك'}</div>
              </div>
              {!TUTOR_API && <span className="demo-tag">وضع تجريبي · غير متصل بالـ API</span>}
            </div>

            <div className="chat-log" ref={logRef}>
              {msgs.map((m, i) => (
                <div key={i} className={'msg ' + (m.role === 'me' ? 'me' : 'ai')}>
                  <div className={'avatar ' + (m.role === 'me' ? 'me' : 'ai')}>
                    {m.role === 'me' ? <I.Award size={16} /> : <I.Spark size={16} />}
                  </div>
                  <div>
                    <div className={'bubble ' + (m.role === 'me' ? 'me' : 'ai')}>{m.text}</div>
                    {m.at ? <div className="msg-time" style={{ textAlign: m.role === 'me' ? 'right' : 'left' }}>{hhmm(m.at)}</div> : null}
                  </div>
                </div>
              ))}
              {thinking && (
                <div className="msg ai">
                  <div className="avatar ai"><I.Spark size={16} /></div>
                  <div className="bubble ai"><span className="typing"><i /><i /><i /></span></div>
                </div>
              )}
            </div>

            {msgs.length <= 1 && (
              <div className="suggest">
                {TUTOR_CHIPS.map(c => (
                  <button type="button" key={c} className="chip" onClick={() => send(c)}>{c}</button>
                ))}
              </div>
            )}

            <div className="composer">
              <textarea ref={taRef} value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={onKey}
                placeholder="اكتب سؤالك… (Enter للإرسال · Shift+Enter لسطر جديد)" aria-label="رسالتك" />
              <button type="button" className="send-btn" onClick={() => send()} disabled={!draft.trim() || thinking} aria-label="إرسال">
                <I.Send size={19} />
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ═══ Mock Exam ═══ */
    function ExamClock({ phase, endsAt, onExpire }) {
      const [left, setLeft] = useState(() => phase === 'running' ? Math.max(0, Math.round((endsAt - Date.now()) / 1000)) : 0);
      useEffect(() => {
        if (phase !== 'running') return;
        const t = setInterval(() => {
          const rem = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
          setLeft(rem);
          if (rem <= 0) onExpire();
        }, 1000);
        return () => clearInterval(t);
      }, [phase, endsAt, onExpire]);
      const warn = left <= 600 && left > 120;
      const crit = left <= 120;
      const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      return (
        <div className={'exam-timer' + (crit ? ' crit' : warn ? ' warn' : '')}>
          <I.Timer size={19} />
          <span className="exam-clock">{fmt(left)}</span>
        </div>
      );
    }

    function ExamTimeLeft({ phase, endsAt }) {
      const [left, setLeft] = useState(() => phase === 'running' ? Math.max(0, Math.round((endsAt - Date.now()) / 1000)) : 0);
      useEffect(() => {
        if (phase !== 'running') return;
        const t = setInterval(() => {
          setLeft(Math.max(0, Math.round((endsAt - Date.now()) / 1000)));
        }, 1000);
        return () => clearInterval(t);
      }, [phase, endsAt]);
      const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      return <span className="card-sub nums">{fmt(left)} متبقية</span>;
    }

    const MOCK_SEC_CFG = {
      Grammar: { q: 30, min: 25 },
      Reading: { q: 20, min: 30 },
      Vocabulary: { q: 10, min: 10 },
      Listening: { q: 10, min: 15 }
    };

    function MockExam({ go }) {
      const [phase, setPhase] = useState('intro');
      const [qs, setQs] = useState([]);
      const [secIdx, setSecIdx] = useState(0);
      const [i, setI] = useState(0);
      const [ans, setAns] = useState({});
      const [flags, setFlags] = useState({});
      const [times, setTimes] = useState({});
      const [startedAt, setStartedAt] = useState(0);
      const [endsAt, setEndsAt] = useState(0);
      const [result, setResult] = useState(null);
      const [openCtx, setOpenCtx] = useState(false);
      const [tts, setTts] = useState(false);
      const [showReview, setShowReview] = useState(false);

      const doneRef = useRef(false);
      const expireRef = useRef(null);
      const lastTRef = useRef(Date.now());
      const curIRef = useRef(0);

      const history = useMemo(() => S.get('mock', []), [phase]);
      const best = history.length ? Math.max.apply(null, history.map(r => r.score)) : null;

      const stopTts = () => { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch { } };
      useEffect(() => () => { EXAM_LOCK = false; stopTts(); }, []);

      const secName = MOCK_SECTIONS[secIdx];
      const secStart = useMemo(() => {
        let count = 0;
        for (let j = 0; j < secIdx; j++) count += qs.filter(q => q.sec === MOCK_SECTIONS[j]).length;
        return count;
      }, [qs, secIdx]);

      const secQs = useMemo(() => qs.filter(q => q.sec === secName), [qs, secName]);
      const absI = secStart + i;

      const updateTime = () => {
        const now = Date.now();
        const diff = now - lastTRef.current;
        setTimes(prev => ({ ...prev, [curIRef.current]: (prev[curIRef.current] || 0) + diff }));
        lastTRef.current = now;
      };

      const finishExam = React.useCallback((allQs, auto) => {
        if (doneRef.current) return;
        doneRef.current = true;
        updateTime();
        EXAM_LOCK = false;
        stopTts(); setTts(false);

        const bySec = {};
        const bySub = {};
        MOCK_SECTIONS.forEach(s => { bySec[s] = { total: 0, correct: 0, answered: 0 }; });
        let correct = 0, answered = 0;

        const timeArr = [];
        const newMs = S.get('mistakes', {});
        
        // Compute final times locally since setTimes is async
        const finalTimes = { ...times };
        const now = Date.now();
        const diff = now - lastTRef.current;
        finalTimes[curIRef.current] = (finalTimes[curIRef.current] || 0) + diff;

        allQs.forEach((q, idx) => {
          const b = bySec[q.sec];
          if (b) b.total++;
          if (q.sub) {
            if (!bySub[q.sub]) bySub[q.sub] = { total: 0, correct: 0, answered: 0 };
            bySub[q.sub].total++;
          }

          const tMs = finalTimes[idx] || 0;
          timeArr.push({ q, tMs, ans: ans[idx], ok: ans[idx] === q.ans });

          if (ans[idx] != null) {
            if (b) b.answered++;
            answered++;
            if (q.sub) bySub[q.sub].answered++;
            if (ans[idx] === q.ans) {
              if (b) b.correct++;
              correct++;
              if (q.sub) bySub[q.sub].correct++;
            } else {
              if (!newMs[q.id]) newMs[q.id] = { attempts: 0, consecRight: 0, added: Date.now() };
              newMs[q.id].attempts++;
            }
          }
        });

        try { S.set('mistakes', newMs); } catch { }

        timeArr.sort((a, b) => b.tMs - a.tMs);
        const slowest = timeArr.slice(0, 5);

        const total = allQs.length || 1;
        const score = Math.round(correct / total * 100);
        let usedMs = 0;
        Object.values(finalTimes).forEach(t => usedMs += t);
        const used = Math.round(usedMs / 1000);

        if (answered > 0) { logAct('attempts', answered); logAct('correct', correct); }
        const rec = { score, correct, answered, total: allQs.length, bySec, bySub, slowest, used, auto: !!auto, at: Date.now() };
        try { S.set('mock', [rec].concat(S.get('mock', [])).slice(0, 10)); } catch { }
        setResult(rec); setPhase('done'); setShowReview(false);
      }, [ans, times]);

      expireRef.current = () => {
        updateTime();
        if (secIdx < MOCK_SECTIONS.length - 1) {
          startSection(secIdx + 1, qs);
        } else {
          finishExam(qs, true);
        }
      };

      const startSection = (idx, allQs) => {
        const sName = MOCK_SECTIONS[idx];
        const sLen = allQs.filter(q => q.sec === sName).length;
        if (sLen === 0) {
          if (idx < MOCK_SECTIONS.length - 1) startSection(idx + 1, allQs);
          else finishExam(allQs, false);
          return;
        }
        setSecIdx(idx);
        setI(0);

        let cCount = 0;
        for (let j = 0; j < idx; j++) cCount += allQs.filter(q => q.sec === MOCK_SECTIONS[j]).length;
        curIRef.current = cCount;

        const limitMins = MOCK_SEC_CFG[sName] ? MOCK_SEC_CFG[sName].min : 20;
        const t = Date.now();
        lastTRef.current = t;
        setEndsAt(t + limitMins * 60 * 1000);
        setPhase('running');
      };

      const start = () => {
        const seen = S.get('seen', {});
        const pool = MOCK_SECTIONS.reduce((out, s) => {
          let cQs = MOCK_POOL.filter(q => q.sec === s);
          cQs = shuffleArr(cQs);
          cQs.sort((a, b) => (seen[a.id] || 0) - (seen[b.id] || 0));
          const limit = MOCK_SEC_CFG[s]?.q || 20;
          cQs = cQs.slice(0, limit);
          return out.concat(cQs.map(q => shuffleOpts(q)));
        }, []);
        pool.forEach(q => { seen[q.id] = Date.now(); });
        try { S.set('seen', seen); } catch { }

        doneRef.current = false;
        setQs(pool); setAns({}); setFlags({}); setTimes({});
        setResult(null); setOpenCtx(false);
        EXAM_LOCK = true;
        startSection(0, pool);
      };

      const goQ = n => {
        updateTime();
        setI(n);
        curIRef.current = secStart + n;
        setOpenCtx(false); stopTts(); setTts(false);
      };

      const speakCtx = () => {
        if (!('speechSynthesis' in window)) return;
        const synth = window.speechSynthesis;
        if (tts) { synth.cancel(); setTts(false); return; }
        synth.cancel();
        const u = new SpeechSynthesisUtterance(LISTENING.transcript);
        u.lang = 'en-US'; u.rate = 1;
        u.onend = () => setTts(false); u.onerror = () => setTts(false);
        synth.speak(u); setTts(true);
      };

      const fmt = s => {
        const v = Math.max(0, Math.floor(s || 0));
        return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
      };

      const askSubmitSec = () => {
        updateTime();
        setPhase('review');
      };

      /* ─── Intro ─── */
      if (phase === 'intro') {
        const counts = {};
        const mins = {};
        let totalQ = 0, totalM = 0;
        MOCK_SECTIONS.forEach(s => {
          counts[s] = MOCK_SEC_CFG[s]?.q || 20;
          mins[s] = MOCK_SEC_CFG[s]?.min || 20;
          totalQ += counts[s];
          totalM += mins[s];
        });
        
        // Graph data
        const graphData = history.slice(0, 10).reverse();

        return (
          <div>
            <div className="page-head">
              <h1 className="page-title">اختبار المحاكاة</h1>
              <div className="page-sub">محاكاة كاملة بتوقيت حقيقي لكل قسم — تدرّب على إدارة وقتك قبل القاعة</div>
            </div>

            <div style={{ maxWidth: 760, margin: '0 auto' }}>
              <div className="card mb20">
                <div className="row between wrap g16 mb20">
                  <div className="row g12">
                    <div className="tile-icon" style={{ width: 52, height: 52, borderRadius: 16, background: 'var(--coral-bg)', color: 'var(--coral)' }}>
                      <I.Timer size={24} />
                    </div>
                    <div>
                      <div className="card-title" style={{ fontSize: 18 }}>Full STEP Mock Exam</div>
                      <div className="card-sub">4 أقسام · {totalQ} سؤال · {totalM} دقيقة كلياً</div>
                    </div>
                  </div>
                  {best != null && <span className="badge badge-emerald"><I.Award size={11} /> أفضل نتيجة: {best}%</span>}
                </div>

                <div className="grid-2 mb20" style={{ gap: 11 }}>
                  {MOCK_SECTIONS.map(s => (
                    <div key={s} className="row between g12" style={{
                      padding: '13px 16px', borderRadius: 13,
                      background: CBG[MOCK_SEC_C[s]], border: '1px solid ' + CVAR[MOCK_SEC_C[s]] + '3d'
                    }}>
                      <div className="col">
                         <span className="rtl" style={{ fontWeight: 800, fontSize: 13.5, color: CVAR[MOCK_SEC_C[s]] }}>{MOCK_SEC_AR[s]}</span>
                         <span style={{ fontSize: 11, color: 'var(--text-3)' }}>{mins[s]} دقيقة</span>
                      </div>
                      <span className="nums" style={{ fontWeight: 800, fontSize: 13, color: CVAR[MOCK_SEC_C[s]] }}>{counts[s]} أسئلة</span>
                    </div>
                  ))}
                </div>

                <div className="rules">
                  <div className="rule"><span className="rule-n">1</span><span>المؤقّت منفصل <b>لكل قسم</b>. إذا انتهى وقت القسم تنتقل للقسم التالي فوراً دون إمكانية الرجوع.</span></div>
                  <div className="rule"><span className="rule-n">2</span><span>لا تظهر الإجابات الصحيحة أثناء الاختبار — فقط بعد الانتهاء التام يتم تحليل أدائك بدقة.</span></div>
                  <div className="rule"><span className="rule-n">3</span><span>تستطيع تمييز الأسئلة بعلامة <b>🚩</b> للرجوع إليها قبل تسليم القسم، وتوجد <b>شاشة مراجعة</b> قبل التسليم.</span></div>
                  <div className="rule"><span className="rule-n">4</span><span>تضاف أي أسئلة تخطئ فيها تلقائياً إلى <b>دفتر الأخطاء</b> لتتدرب عليها لاحقاً.</span></div>
                </div>

                <button type="button" className="start-cta" onClick={start}>
                  <I.Timer size={22} /> ابدأ الاختبار الآن
                </button>
              </div>

              {history.length > 0 && (
                <div className="card">
                  <h2 className="card-title mb16">محاولاتك السابقة وتطور النتيجة</h2>
                  {graphData.length > 1 && (
                    <div className="history-graph row g4 align-end mb24" style={{ height: 110, padding: 10, borderBottom: '1px solid var(--brd)' }}>
                      {graphData.map((h, k) => (
                        <div key={k} className="col center g4" style={{ flex: 1, minWidth: 30 }}>
                          <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-2)' }}>{h.score}%</div>
                          <div style={{ width: '100%', maxWidth: 40, background: 'var(--coral)', borderRadius: '4px 4px 0 0', height: `${(h.score / 100) * 70}px`, minHeight: 4 }} />
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="col g8">
                    {history.slice(0, 5).map((h, k) => (
                      <div key={k} className="row between g12" style={{ padding: '11px 15px', borderRadius: 12, background: 'rgba(255,255,255,.03)', border: '1px solid var(--brd)' }}>
                        <span className="card-sub">{new Date(h.at).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' })}</span>
                        <span className="card-sub nums">{h.correct}/{h.total} · {fmt(h.used)}</span>
                        <span className="nums" style={{ fontWeight: 800, fontSize: 15, color: h.score >= 70 ? 'var(--emerald)' : h.score >= 55 ? 'var(--amber)' : 'var(--rose)' }}>{h.score}%</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ─── Review ─── */
      if (phase === 'review') {
        const isLastSec = secIdx === MOCK_SECTIONS.length - 1;
        return (
          <div>
            <div className="page-head">
              <h1 className="page-title">مراجعة قسم {MOCK_SEC_AR[secName]}</h1>
              <div className="page-sub">تأكد من الأسئلة المعلقة وغير المجابة قبل التسليم. الوقت ما زال يحسب.</div>
            </div>
            <div style={{ maxWidth: 760, margin: '0 auto' }}>
              <div className="card mb20">
                <div className="col g8">
                  {secQs.map((q, j) => {
                    const aI = secStart + j;
                    const a = ans[aI];
                    const flg = flags[aI];
                    const st = a == null ? 'بدون إجابة' : 'مُجاب';
                    return (
                      <div key={j} className="row between g12" style={{ padding: '12px 16px', background: 'var(--bg)', borderRadius: 8, border: '1px solid ' + (flg ? 'var(--amber)' : 'var(--brd)') }}>
                        <div className="row g12 wrap">
                          <span style={{ fontWeight: 800, width: 24, textAlign: 'center' }} className="nums">{j + 1}</span>
                          <span className={"badge badge-" + (a == null ? 'rose' : 'emerald')}>{st}</span>
                          {flg && <span className="badge badge-amber"><I.Flag size={12} /> مُعلَّم</span>}
                        </div>
                        <button className="btn btn-sm btn-ghost" onClick={() => { setI(j); curIRef.current = aI; lastTRef.current = Date.now(); setPhase('running'); }}>الرجوع للسؤال</button>
                      </div>
                    )
                  })}
                </div>
                <div className="row g12 mt24" style={{ justifyContent: 'center' }}>
                  <button className="btn btn-primary" onClick={() => {
                    if (isLastSec) finishExam(qs, false);
                    else startSection(secIdx + 1, qs);
                  }}>
                    <I.Check size={16} /> {isLastSec ? 'تسليم الاختبار نهائياً' : 'تسليم والانتقال للقسم التالي'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      /* ─── Report ─── */
      if (phase === 'done' && result) {
        const band = result.score >= 85 ? { t: 'ممتاز — جاهز للاختبار', c: 'emerald' }
          : result.score >= 70 ? { t: 'جيد جداً — ثبّت نقاط ضعفك', c: 'indigo' }
            : result.score >= 55 ? { t: 'جيد — يحتاج مراجعة مركّزة', c: 'amber' }
              : { t: 'يحتاج تدريباً مكثفاً', c: 'rose' };
        const blank = result.total - result.answered;
        const perQ = result.answered ? Math.round(result.used / result.answered) : 0;
        
        let totalM = 0;
        MOCK_SECTIONS.forEach(s => totalM += (MOCK_SEC_CFG[s]?.min || 20));

        return (
          <div>
            <div className="page-head">
              <h1 className="page-title">تقرير اختبار المحاكاة</h1>
              <div className="page-sub">{result.auto ? 'انتهى الوقت وتم التسليم تلقائياً' : 'تم التسليم يدوياً'}</div>
            </div>

            <div style={{ maxWidth: 780, margin: '0 auto' }}>
              <div className="score-hero">
                <div className="hero-label" style={{ color: 'var(--text-3)', justifyContent: 'center' }}>SIMULATED STEP SCORE</div>
                <div className="score-num">{result.score}<small> / 100</small></div>
                <div className="rtl" style={{ fontFamily: "'Cairo', sans-serif", fontSize: 19, fontWeight: 800, margin: '14px 0 8px', color: CVAR[band.c] }}>{band.t}</div>
                <div className="rtl nums" style={{ color: 'var(--text-2)', fontSize: 13.5 }}>
                  {result.correct} إجابة صحيحة من {result.total} · استغرقت {fmt(result.used)} من {fmt(totalM * 60)}
                </div>
              </div>

              <div className="grid-2 g16 mb24">
                <div className="card">
                  <h2 className="sec-head mb16"><span className="sec-bar" /> النتيجة حسب القسم</h2>
                  <div className="col g10">
                    {MOCK_SECTIONS.map(s => {
                      const b = result.bySec[s];
                      if (!b || b.total === 0) return null;
                      const p = Math.round(b.correct / b.total * 100);
                      return (
                        <div key={s} className="sec-row">
                          <span className="sec-name" style={{ color: CVAR[MOCK_SEC_C[s]] }}>{MOCK_SEC_AR[s]}</span>
                          <div className="track">
                            <div className="fill" style={{ width: p + '%', background: CVAR[MOCK_SEC_C[s]] }} />
                          </div>
                          <span className="sec-score nums" style={{ color: CVAR[MOCK_SEC_C[s]] }}>{b.correct}/{b.total}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="card">
                  <h2 className="sec-head mb16"><span className="sec-bar" /> تحليل المهارات الفرعية</h2>
                  <div className="col g10" style={{ maxHeight: 200, overflowY: 'auto', paddingRight: 5 }}>
                    {Object.keys(result.bySub || {}).sort((a,b) => result.bySub[a].correct/result.bySub[a].total - result.bySub[b].correct/result.bySub[b].total).map(sub => {
                       const b = result.bySub[sub];
                       if (!b || b.total === 0) return null;
                       const p = Math.round(b.correct / b.total * 100);
                       const color = p >= 70 ? 'var(--emerald)' : p >= 50 ? 'var(--amber)' : 'var(--rose)';
                       return (
                         <div key={sub} className="row between g12" style={{ fontSize: 12.5 }}>
                           <span style={{ color: 'var(--text-2)', flex: 1 }}>{sub}</span>
                           <div className="track grow" style={{ height: 6 }}><div className="fill" style={{ width: p+'%', background: color }}/></div>
                           <span className="nums" style={{ color, fontWeight: 700, width: 40, textAlign: 'left' }}>{p}%</span>
                         </div>
                       );
                    })}
                  </div>
                </div>
              </div>

              <div className="card mb24">
                <h2 className="sec-head mb16"><span className="sec-bar" /> أبطأ 5 أسئلة استغرقت وقتاً</h2>
                <div className="col g10">
                   {result.slowest && result.slowest.map((sl, k) => (
                     <div key={k} className="row between g12" style={{ padding: '12px 16px', background: 'rgba(255,255,255,.03)', borderRadius: 8, border: '1px solid var(--brd)' }}>
                        <div className="grow">
                           <div className="row g8 mb8">
                             <span className={"badge badge-"+MOCK_SEC_C[sl.q.sec]}>{sl.q.sec}</span>
                             <span className={"badge badge-"+(sl.ok ? "emerald" : "rose")}>{sl.ok ? "إجابة صحيحة" : "إجابة خاطئة"}</span>
                           </div>
                           <div style={{ fontSize: 13.5, fontWeight: 600 }}>{sl.q.q.substring(0, 80)}...</div>
                        </div>
                        <div className="col center g4">
                           <I.Timer size={16} color="var(--amber)" />
                           <span className="nums" style={{ color: 'var(--amber)', fontWeight: 800 }}>{Math.round(sl.tMs/1000)} ث</span>
                        </div>
                     </div>
                   ))}
                </div>
              </div>

              <h2 className="sec-head"><span className="sec-bar" /> تحليل إدارة الوقت</h2>
              <div className="grid-3 mb24">
                <div className="stat">
                  <div className="stat-glow" style={{ background: 'radial-gradient(circle, var(--indigo), transparent 70%)' }} />
                  <div className="stat-num nums" style={{ color: 'var(--indigo)' }}>{fmt(result.used)}</div>
                  <div className="stat-lbl">الوقت المستهلك الكلي</div>
                </div>
                <div className="stat">
                  <div className="stat-glow" style={{ background: 'radial-gradient(circle, var(--emerald), transparent 70%)' }} />
                  <div className="stat-num nums" style={{ color: 'var(--emerald)' }}>{perQ}<span style={{ fontSize: 16 }}>ث</span></div>
                  <div className="stat-lbl">متوسط الوقت لكل سؤال</div>
                </div>
                <div className="stat">
                  <div className="stat-glow" style={{ background: 'radial-gradient(circle, ' + (blank ? 'var(--rose)' : 'var(--emerald)') + ', transparent 70%)' }} />
                  <div className="stat-num nums" style={{ color: blank ? 'var(--rose)' : 'var(--emerald)' }}>{blank}</div>
                  <div className="stat-lbl">سؤال بدون إجابة</div>
                </div>
              </div>

              <div className={'explain ' + (blank > 0 || result.auto ? 'explain-bad' : 'explain-ok')} style={{ marginTop: 0 }}>
                {result.auto && blank > 0
                  ? 'انتهى الوقت قبل أن تكمل، وتُرك ' + blank + ' سؤال بدون إجابة. أسئلتك الخاطئة تمت إضافتها لدفتر الأخطاء.'
                  : blank > 0
                    ? 'سلّمت مبكراً وتركت ' + blank + ' سؤال فارغاً. أسئلتك الخاطئة في دفتر الأخطاء للتدريب.'
                    : 'أجبت على كل الأسئلة. تم ترحيل أي سؤال خاطئ لدفتر الأخطاء لتتدرّب عليه لاحقاً!'}
              </div>

              <div className="row g12 wrap mt20" style={{ justifyContent: 'center' }}>
                <button type="button" className="btn btn-primary" onClick={start}><I.Redo size={15} /> محاولة جديدة</button>
                <button type="button" className="btn btn-ghost" onClick={() => setShowReview(v => !v)}>
                  <I.Eye size={15} /> {showReview ? 'إخفاء المراجعة' : 'مراجعة الإجابات'}
                </button>
                <button type="button" className="btn btn-ghost" onClick={() => go('dashboard')}><I.Home size={15} /> لوحة التقدم</button>
              </div>

              {showReview && (
                <div className="col g10 mt20">
                  {qs.map((q, idx) => {
                    const a = ans[idx];
                    const ok = a != null && a === q.ans;
                    const st = a == null ? 'skip' : ok ? 'ok' : 'no';
                    return (
                      <div key={idx} className="review-row">
                        <span className={'review-n ' + st}>{idx + 1}</span>
                        <div className="grow">
                          <div className="row g8 mb8 wrap">
                            <span className={'badge badge-' + MOCK_SEC_C[q.sec]}>{MOCK_SEC_AR[q.sec]}</span>
                            <span className={'badge badge-' + (st === 'ok' ? 'emerald' : st === 'no' ? 'rose' : 'amber')}>
                              {st === 'ok' ? 'صحيح' : st === 'no' ? 'خطأ' : 'بدون إجابة'}
                            </span>
                            <span className="nums" style={{ fontSize: 11, color: 'var(--text-3)' }}>⏱️ {Math.round((times[idx]||0)/1000)} ث</span>
                          </div>
                          <div style={{ fontWeight: 700, marginBottom: 7 }}>{q.q}</div>
                          <div style={{ color: 'var(--emerald)', fontSize: 12.5, marginBottom: 3 }}>
                            الإجابة الصحيحة: {String.fromCharCode(65 + q.ans)} — {q.opts[q.ans]}
                          </div>
                          {a != null && !ok && (
                            <div style={{ color: 'var(--rose)', fontSize: 12.5, marginBottom: 3 }}>
                              إجابتك: {String.fromCharCode(65 + a)} — {q.opts[a]}
                            </div>
                          )}
                          <div className="rtl" style={{ color: 'var(--text-3)', fontSize: 12.5, lineHeight: 1.8, textAlign: 'left' }}>{q.exp}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ─── Running ─── */
      const q = secQs[i] || secQs[0];
      const chosen = ans[absI];
      
      const now = Date.now();
      const left = Math.max(0, Math.floor((endsAt - now) / 1000));
      const warn = left <= 300 && left > 60;
      const crit = left <= 60;

      return (
        <div>
          <div className="exam-bar">
            <ExamClock phase={phase} endsAt={endsAt} onExpire={() => expireRef.current(true)} />
            <div className="exam-meta">
              <span className="badge" style={{ background: 'var(--bg)', color: 'var(--text)', border: '1px solid var(--brd)' }}>{MOCK_SEC_AR[secName]}</span>
            </div>
            <div className="track grow" style={{ height: 7, minWidth: 90, maxWidth: 240 }}>
              <div className="fill" style={{ width: (secQs.length ? (i + 1) / secQs.length * 100 : 0) + '%', background: 'var(--grad-coral)', color: 'var(--coral)' }} />
            </div>
            <button type="button" className="btn btn-primary btn-sm" style={{ marginLeft: 'auto' }} onClick={askSubmitSec}>
              <I.Check size={15} /> تسليم القسم
            </button>
          </div>

          <div style={{ maxWidth: 760, margin: '0 auto' }}>
            <div className="row between wrap g12 mb16">
              <div className="row g8 wrap">
                <span className={'badge badge-' + MOCK_SEC_C[secName]}>السؤال {i + 1} من {secQs.length}</span>
                <span className="card-sub nums" style={{ fontSize: 12 }}>رقم السؤال العام: {absI + 1} / {qs.length}</span>
              </div>
              <button type="button" className={'btn btn-sm ' + (flags[absI] ? 'btn-primary' : 'btn-ghost')}
                onClick={() => setFlags(f => ({ ...f, [absI]: !f[absI] }))}>
                <I.Flag size={14} /> {flags[absI] ? 'مُعلَّم للمراجعة' : 'علّم للمراجعة'}
              </button>
            </div>

            {q && q.ctx === 'reading' && (
              <div className="exam-ctx">
                <button type="button" className="exam-ctx-head" onClick={() => setOpenCtx(v => !v)}>
                  <I.Book size={15} /> <span className="grow">{PASSAGE.title}</span>
                  <span style={{ fontSize: 11.5 }}>{openCtx ? 'إخفاء النص' : 'عرض النص'}</span>
                </button>
                {openCtx && (
                  <div className="exam-ctx-body">
                    {PASSAGE.body.split('\n\n').map((p, k) => <p key={k}>{p}</p>)}
                  </div>
                )}
              </div>
            )}

            {q && q.ctx === 'listening' && (
              <div className="exam-ctx">
                <div className="exam-ctx-head" style={{ cursor: 'default' }}>
                  <I.Headphones size={15} /> <span className="grow">{LISTENING.title}</span>
                  <button type="button" className="btn btn-sm btn-ghost" onClick={speakCtx}>
                    {tts ? <I.Pause size={13} /> : <I.Play size={13} />} {tts ? 'إيقاف' : 'استمع'}
                  </button>
                </div>
              </div>
            )}

            {q && (
              <div className="quiz-card">
                <div className="quiz-q">{q.q}</div>
                <div className="col g10">
                  {q.opts.map((o, oi) => (
                    <button type="button" key={oi} onClick={() => setAns(a => ({ ...a, [absI]: oi }))}
                      className={'opt' + (chosen === oi ? ' sel' : '')}>
                      <span className="opt-key">{String.fromCharCode(65 + oi)}</span>
                      <span className="grow">{o}</span>
                      {chosen === oi && <I.Check size={16} />}
                    </button>
                  ))}
                </div>
                {chosen != null && (
                  <button type="button" className="btn btn-ghost btn-sm mt16"
                    onClick={() => setAns(a => { const n = { ...a }; delete n[absI]; return n; })}>
                    <I.X size={13} /> إلغاء الاختيار
                  </button>
                )}
              </div>
            )}

            <div className="row between g12 mt16">
              <button type="button" className="btn btn-ghost btn-sm" disabled={i === 0} onClick={() => goQ(i - 1)}>← السابق</button>
              <ExamTimeLeft phase={phase} endsAt={endsAt} />
              <button type="button" className="btn btn-primary btn-sm" disabled={i >= secQs.length - 1} onClick={() => goQ(i + 1)}>التالي →</button>
            </div>

            <div className="card mt20">
              <div className="row between wrap g12 mb16">
                <div className="card-title" style={{ fontSize: 14 }}>خريطة أسئلة قسم {MOCK_SEC_AR[secName]}</div>
                <div className="row g12 wrap card-sub">
                  <span className="row g6"><i style={{ width: 9, height: 9, borderRadius: 3, background: 'var(--indigo)', display: 'block' }} /> مُجاب</span>
                  <span className="row g6"><i style={{ width: 9, height: 9, borderRadius: '50%', background: 'var(--amber)', display: 'block' }} /> مُعلَّم</span>
                </div>
              </div>
              <div className="palette">
                {secQs.map((_, k) => {
                  const aI = secStart + k;
                  return (
                    <button type="button" key={k} onClick={() => goQ(k)} aria-label={'السؤال ' + (k + 1)}
                      className={'pal-btn' + (k === i ? ' at' : ans[aI] != null ? ' ans' : '') + (flags[aI] ? ' flag' : '')}>
                      {k + 1}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══ App ═══ */
    function ErrorNotebook() {
      const [ms, setMs] = useState(() => S.get('mistakes', {}));
      const [activeQ, setActiveQ] = useState(null);
      const [picked, setPicked] = useState(null);
      
      const wrongQs = useMemo(() => {
        return Object.keys(ms).map(id => {
          const q = ALL_QS.find(x => x.id === id);
          return q ? { ...q, mistakeData: ms[id] } : null;
        }).filter(Boolean).sort((a, b) => b.mistakeData.added - a.mistakeData.added);
      }, [ms]);

      const handlePick = oi => {
        if (picked != null) return;
        setPicked(oi);
        const qId = activeQ.id;
        const newMs = { ...ms };
        if (activeQ.ans === oi) {
          newMs[qId].consecRight = (newMs[qId].consecRight || 0) + 1;
          if (newMs[qId].consecRight >= 3) {
            delete newMs[qId];
            setTimeout(() => { alert('أحسنت! تم إزالة السؤال من دفتر الأخطاء بعد 3 إجابات صحيحة متتالية.'); }, 500);
          }
        } else {
          newMs[qId].consecRight = 0;
          newMs[qId].attempts++;
        }
        try { S.set('mistakes', newMs); } catch {}
        setMs(newMs);
      };

      if (activeQ) {
        return (
          <div className="view">
             <button className="btn btn-ghost mb16" onClick={() => { setActiveQ(null); setPicked(null); }}>← العودة للدفتر</button>
             <div className="quiz-card">
                <div className="quiz-q">{activeQ.q}</div>
                <div className="col g10 mt16">
                  {activeQ.opts.map((o, oi) => (
                    <button key={oi} className={'opt' + (picked === oi ? ' sel' : '')} onClick={() => handlePick(oi)}>
                      <span className="opt-key">{String.fromCharCode(65 + oi)}</span>
                      <span className="grow">{o}</span>
                      {picked != null && oi === activeQ.ans && <I.Check size={16} />}
                      {picked != null && oi === picked && oi !== activeQ.ans && <I.X size={16} />}
                    </button>
                  ))}
                </div>
                {picked != null && (
                  <div className={'explain mt16 ' + (picked === activeQ.ans ? 'explain-ok' : 'explain-bad')}>
                    <strong>{picked === activeQ.ans ? 'إجابة صحيحة. ' : 'الإجابة الصحيحة: ' + String.fromCharCode(65 + activeQ.ans) + '. '}</strong>{activeQ.exp}
                  </div>
                )}
             </div>
          </div>
        );
      }

      return (
        <div className="view">
          <div className="page-head">
            <h1 className="page-title">دفتر الأخطاء</h1>
            <div className="page-sub">أسئلة تحتاج مراجعة بناءً على أخطائك (تُحذف بعد 3 إجابات صحيحة متتالية)</div>
          </div>
          {wrongQs.length === 0 ? (
            <div className="card" style={{ textAlign: 'center', padding: 40 }}>دفتر الأخطاء فارغ. أداؤك ممتاز!</div>
          ) : (
            <div className="col g12">
              {wrongQs.map(q => (
                <div key={q.id} className="card card-hover row between" onClick={() => { setActiveQ(q); setPicked(null); }} style={{ cursor: 'pointer' }}>
                  <div className="grow">
                     <div style={{ fontSize: 13, color: 'var(--text-3)', marginBottom: 5 }}>{q.sec} • {q.sub}</div>
                     <div style={{ fontWeight: 600, paddingLeft: 10 }}>{q.q.substring(0, 70)}...</div>
                  </div>
                  <div className="nums" style={{ color: 'var(--coral)', fontSize: 12, textAlign: 'center', minWidth: 60 }}>
                     <div style={{ fontSize: 18, fontWeight: 800 }}>{q.mistakeData.attempts}</div>
                     <div>خطأ</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [active, setActive] = useState('dashboard');
      const [menu, setMenu] = useState(false);
      const [notes, setNotes] = useState(() => S.get('notes', []));
      const [words, setWords] = useState(() => S.get('vocab', SEED_VOCAB));
      const [streak, setStreak] = useState(() => S.get('streak', 1));

      useEffect(() => {
        const today = new Date().toDateString();
        const last = S.get('lastDay', null);
        if (last === today) return;
        const y = new Date(); y.setDate(y.getDate() - 1);
        const next = last === y.toDateString() ? S.get('streak', 0) + 1 : 1;
        S.set('streak', next); S.set('lastDay', today); setStreak(next);
      }, []);

      const vocabStats = useMemo(() => {
        const s = { new: 0, reviewing: 0, mastered: 0 };
        words.forEach(w => { s[w.status] = (s[w.status] || 0) + 1; });
        return s;
      }, [words]);

      const mainRef = useRef(null);
      const go = id => {
        if (EXAM_LOCK && id !== 'mock') {
          if (!window.confirm('اختبار المحاكاة ما زال جارياً — الخروج الآن يلغي المحاولة. هل تريد الخروج؟')) return;
          EXAM_LOCK = false;
        }
        setActive(id);
        setMenu(false);
        if (mainRef.current) mainRef.current.scrollTop = 0;
      };
      const counts = { notes: notes.length, vocab: words.length, quiz: QUIZ.length, listening: LISTENING.questions.length, mock: MOCK_POOL.length };

      return (
        <div className="app">
          {menu && <div className="scrim" onClick={() => setMenu(false)} />}
          <Sidebar active={active} go={go} open={menu} streak={streak} counts={counts} />
          <main className="main" ref={mainRef}>
            <div className="mobile-bar">
              <button className="btn btn-ghost btn-icon" onClick={() => setMenu(true)} aria-label="فتح القائمة"><I.Menu size={19} /></button>
              <div style={{ fontWeight: 800, fontSize: 15.5, letterSpacing: '-.02em' }}>STEP Arena</div>
              <div className="row g6" style={{ color: 'var(--coral)', fontWeight: 700, fontSize: 13 }}><I.Flame size={15} /><span className="nums">{streak}</span></div>
            </div>

            <div className="view" key={active}>
              {active === 'dashboard' && <Dashboard go={go} streak={streak} vocabStats={vocabStats} noteCount={notes.length} />}
              {active === 'notes' && <NotesHub notes={notes} setNotes={setNotes} />}
              {active === 'reading' && <ReadingHall />}
              {active === 'listening' && <ListeningLab />}
              {active === 'vocab' && <VocabVault words={words} setWords={setWords} />}
              {active === 'quiz' && <QuizArena />}
              {active === 'mistakes' && <ErrorNotebook />}
              {active === 'mock' && <MockExam go={go} />}
              {active === 'tutor' && <AiTutor />}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>

</html>
