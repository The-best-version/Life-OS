<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>إرثي 2030</title>
<meta name="theme-color" content="#070B1F" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #070B1F 0%, #0D1330 55%, #181538 100%);
    color: #FDF8F6;
    font-family: 'Tajawal', 'Cairo', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #FF8A50; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  .card {
    border-radius: 16px;
    border: 1px solid rgba(255,225,210,0.18);
    background: rgba(198,214,255,0.075);
    backdrop-filter: blur(12px) saturate(150%);
    box-shadow: inset 0 1px 0 0 rgba(255,240,230,0.16), inset 0 -1px 0 0 rgba(0,0,0,0.28),
      0 8px 18px -10px rgba(0,0,0,0.55), 0 30px 64px -34px rgba(0,0,0,0.92);
    padding: 20px;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 700;
    color: #1C141A;
    background: linear-gradient(135deg, #FF5722, #FF8A50);
    box-shadow: 0 8px 24px -10px rgba(255,87,34,0.8);
    transition: transform .15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline {
    border: 1px solid rgba(255,225,210,0.18);
    border-radius: 12px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 700;
    color: #FDF8F6;
    background: rgba(255,255,255,0.04);
  }
  .field {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 14px;
    color: #FDF8F6;
  }
  .field::placeholder { color: rgba(253,248,246,0.3); }
  .field:focus { outline: none; border-color: rgba(255,255,255,0.3); }
  .pill {
    border-radius: 9999px;
    padding: 8px 16px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1px solid transparent;
  }
  .los-title {
    background: linear-gradient(90deg, #FF5722, #FFB020);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .pr-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, rgba(255, 176, 32, 0.25), rgba(255, 87, 34, 0.25));
    border: 1px solid #FFB020;
    color: #FFB020;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(255, 176, 32, 0.35);
    animation: pr-glow 2s infinite alternate;
  }
  @keyframes pr-glow {
    from { box-shadow: 0 0 6px rgba(255, 176, 32, 0.3); }
    to { box-shadow: 0 0 16px rgba(255, 176, 32, 0.6); }
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(7, 11, 31, 0.82);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .pill { transition: transform .15s, filter .15s; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./gym-app.js"></script>
</body>
</html>
